<app-library-menu *ngIf="showBibliothequeMenu && !showAdmin"
                  id="top">
</app-library-menu>
<app-ludo-menu *ngIf="showLudothequeMenu && !showAdmin"
               id="top">
</app-ludo-menu>
<app-admin-menu *ngIf="showAdmin"
                id="top">
</app-admin-menu>
<div class="library-menu" id="top" *ngIf="!showLudothequeMenu && !showBibliothequeMenu && !showAdmin">
  <div class="library-title">
    <div class="title">
      <span [routerLink]="''">{{title}}</span>
    </div>
  </div>
</div>

<ng-container *ngIf="(firebaseDatabaseService.bibliotheque$ | async) && (firebaseDatabaseService.ludotheque$ | async)">
  <router-outlet></router-outlet>
</ng-container>

<div class="go-top bloc-link">
  <div (click)="scrollToTop()" class="go-top-link">
    <mat-icon class="icon">keyboard_arrow_up</mat-icon>
  </div>
</div>
