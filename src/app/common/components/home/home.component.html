<div class="core-page fadein">
    <div class="core-header"
         (click)="navigateService.goToComission(comissions.BIBLIOTHEQUE)">
        <div class="core-title">
            <div class="primary">Bibliotheque</div>
        </div>
        <div class="core-resume">
            Retrouvez vos livres préférés
        </div>
    </div>
    <div class="core-header" (click)="gotoUrl('https://www.bdgest.com/online/collection?IdUser=118221&IdCollection=1')">
        <div class="core-title">
            <div class="primary">BDthèque</div>
        </div>
        <div class="core-resume">
            Retrouvez vos BD préférés
        </div>
    </div>
    <div class="core-header"
         (click)="navigateService.goToComission(comissions.LUDOTHEQUE)">
        <div class="core-title">
            <div class="primary">Ludotheque</div>
        </div>
        <div class="core-resume">
            Les jeux !
        </div>
    </div>
    <div class="core-header"
         (click)="navigateService.goToComission(comissions.BRICOLAGE)">
        <div class="core-title">
            <div class="primary">Bricolage</div>
        </div>
        <div class="core-resume">
            Les outils de vos rêves
        </div>
    </div>
    <div class="core-header"
         (click)="navigateService.goToComission(comissions.SONOTHEQUE)">
        <div class="core-title">
            <div class="primary">Sonothèque</div>
        </div>
        <div class="core-resume">
            Ce soir c'est soirée disco !
        </div>
    </div>
    <div class="core-header"
         (click)="navigateService.goToComission(comissions.NAUTISME)">
        <div class="core-title">
            <div class="primary">Matériel Nautique</div>
        </div>
        <div class="core-resume">
          Paddle, kayak ...
        </div>
    </div>
    <div class="core-header"
         (click)="navigateService.goToComission(comissions.PHOTO)">
        <div class="core-title">
            <div class="primary">Matériel Photo</div>
        </div>
        <div class="core-resume">
          Appareil photo, Vidéo projecteurs ...
        </div>
    </div>
    <div class="core-header"
         *ngIf="authentificationService.userAllowedToWrite$ | async"
         (click)="navigateService.goToBorrowAdmin()">
        <div class="core-title">
            <div class="primary">Gestion des emprunts</div>
        </div>
    </div>
</div>
