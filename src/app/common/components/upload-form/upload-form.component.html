<div class="upload-form" [class.upload-form-disabled]="disabled()">
  <div class="dropzone" [class.dropzone-active]="dragging()"
       (dragover)="dragOver($event)" (dragleave)="dragging.set(false)" (drop)="dropFile($event)">
    @if (imageSrc(); as src) {
      <img class="dropzone-image" [src]="src" alt="Aperçu de la couverture" width="250" height="250">
    } @else {
      <mat-icon class="dropzone-icon" aria-hidden="true">image</mat-icon>
    }
    <p class="dropzone-hint">{{ hint() }}</p>
  </div>
  <div class="upload-actions">
    <button type="button" matButton="outlined" [disabled]="disabled()" (click)="fileInput.click()">
      <mat-icon aria-hidden="true">add_photo_alternate</mat-icon>
      Ajouter l'image
    </button>
    <button type="button" matButton="filled" [disabled]="disabled() || !selectedFile()" (click)="upload()">
      <mat-icon aria-hidden="true">cloud_upload</mat-icon>
      Upload
    </button>
  </div>
  <input hidden #fileInput type="file" accept="image/png, image/jpeg" aria-label="Choisir une image de couverture"
         [multiple]="false" [disabled]="disabled()" (change)="selectFile($event)">
</div>
