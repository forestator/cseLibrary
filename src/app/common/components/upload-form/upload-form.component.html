<div class="upload-form-container">
  <button type="button" mat-raised-button (click)="fileInput.click()">Ajouter l'image</button>
  <input hidden (change)="selectFile($event)" #fileInput type="file"
         [multiple]="false"
         accept="image/png, image/jpeg">

  <img [width]="250"
       alt="filte to upload"
       [src]="previewImage ?? defaultImage"/>

  <div class="upload-btn">
    <button
      color="primary"
      mat-raised-button
      [disabled]="!selectedFile"
      (click)="upload()">
      Upload
    </button>
  </div>
</div>
