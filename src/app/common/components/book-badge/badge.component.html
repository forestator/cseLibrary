<div *ngIf="display==='normal' && txt !== 'DISPONIBLE'" class="badge" [style.background-color]="bg" [style.color]="fg">{{txt}}</div>
<div *ngIf="display==='small' && txt !== 'DISPONIBLE'" class="badge-small" [style.background-color]="bg" [style.color]="fg"></div>
