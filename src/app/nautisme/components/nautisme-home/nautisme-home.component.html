<div class="core-page fadein" *ngIf="nautismeDatabaseService.nautismeLibrary$ | async as library">
  <div class="core-header">
    <div class="core-title">
      <div class="primary">{{library.name}}</div>
    </div>
    <div class="core-resume">
      {{library.resume}}
    </div>
  </div>
  <div class="core-header">
    <div *ngFor="let item of nautismeDatabaseService.allNautisme$ | async; let index = index" class="core-body">
      <app-nautisme-item-row [item]="item" [index]="index"></app-nautisme-item-row>
    </div>
  </div>
  <div class="core-header"
       *ngIf="(authService.userIsAdmin$ | async) || (authService.userIsNautismeAdmin$ | async)">
    <div>
      <div class="core-title">
        <div class="primary">Administration matériel nautique</div>
      </div>
      <div class="core-body" [routerLink]="'admin/nautismeItems'">
        Gestion du matériel nautique
      </div>
    </div>
  </div>
</div>
