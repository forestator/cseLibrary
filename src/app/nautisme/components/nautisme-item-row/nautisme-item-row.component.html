<div [id]="item.id" *ngIf="item" class="book-core">
  <ng-container [ngTemplateOutlet]="image"
                *ngIf="(parity || (toolsService.mobilePhoneDisplay$ | async))"></ng-container>
  <div class="book-infos">
    <div class="book-title">{{item.name}}
      <app-badge [status]="item.status"></app-badge>
    </div>
    <div class="book-info" *ngIf="item.description">Description: {{item.description}}</div>
  </div>
  <ng-container [ngTemplateOutlet]="image"
                *ngIf="!parity && !(toolsService.mobilePhoneDisplay$ | async)"></ng-container>
</div>

<ng-template #image>
  <div class="book-cover">
    <img [src]="item.cover ?? defaultImage" [alt]="item.name"/>
  </div>
</ng-template>
