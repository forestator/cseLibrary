<div class="core-page fadein">
  @if (category$ | async; as category) {
    <div class="core-header">
      <div class="core-title">
        <div class="primary">{{category.name}}</div>
      </div>
      <div class="core-resume">
        {{category.resume}}
      </div>
    </div>
  }
  @for (photoItem of categoryItems$ | async; track photoItem; let index = $index) {
    <div class="core-body">
      <app-materiel-photo-row [item]="photoItem" [index]="index" [selectedItem]="searchedPhotoItemId"></app-materiel-photo-row>
    </div>
  }
</div>
