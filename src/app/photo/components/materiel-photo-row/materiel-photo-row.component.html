@if (item) {
  <div [id]="item.id" class="book-core">
    @if ((parity || (toolsService.mobilePhoneDisplay$ | async))) {
      <ng-container [ngTemplateOutlet]="image"
      ></ng-container>
    }
    <div class="book-infos">
      <div class="book-title">{{item.name}}
        <app-badge [status]="item.status"></app-badge>
      </div>
      @if (item.description) {
        <div class="book-info">Description: {{item.description}}</div>
      }
    </div>
    @if (!parity && !(toolsService.mobilePhoneDisplay$ | async)) {
      <ng-container [ngTemplateOutlet]="image"
      ></ng-container>
    }
  </div>
}

<ng-template #image>
  <div class="book-cover">
    <img [src]="item.cover ?? defaultImage" [alt]="item.name"/>
  </div>
</ng-template>
