<h2 mat-dialog-title>Ajouter un nouvel utilisateur</h2>
<mat-dialog-content>
  <form id="employee-form" class="employee-form" [formGroup]="userFormGroup">
    <mat-form-field appearance="outline">
      <mat-label>Nom</mat-label>
      <input matInput formControlName="lastName" autocomplete="family-name">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Prénom</mat-label>
      <input matInput formControlName="firstName" autocomplete="given-name">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" placeholder="prenom.nom@harmonicinc.com" formControlName="email" autocomplete="email">
      <mat-hint>Proposé automatiquement à partir du nom et du prénom</mat-hint>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton type="button" (click)="cancel()">Annuler</button>
  <button matButton="filled" type="button" [disabled]="userFormGroup.invalid"
          [mat-dialog-close]="userFormGroup.getRawValue()" cdkFocusInitial>Ajouter</button>
</mat-dialog-actions>
