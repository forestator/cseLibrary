@if (rows(); as rows) {
  @if (rows.length) {
    <div class="table-container">
      <table mat-table [dataSource]="rows"
        (matSortChange)="sortData($event)"
        matSort>
        <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="category">Catégorie</th>
          <td mat-cell *matCellDef="let element">
            <app-badge [status]="element.category" />
          </td>
        </ng-container>
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="name">Nom</th>
          <td mat-cell *matCellDef="let element" class="table-name">{{ element.name }}</td>
        </ng-container>
        <ng-container matColumnDef="poids">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="weight">Poids</th>
          <td mat-cell *matCellDef="let element">{{ element.weight }}g</td>
        </ng-container>
        <ng-container matColumnDef="ref">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="ref">Réf.</th>
          <td mat-cell *matCellDef="let element">{{ element.ref }}</td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns();"></tr>
      </table>
    </div>
  } @else {
    <p class="table-empty" role="status">Aucun jeu.</p>
  }
} @else {
  <p class="table-empty" role="status">Chargement…</p>
}
