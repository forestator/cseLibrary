<table *ngIf="dataSource" mat-table [dataSource]="dataSource"
       (matSortChange)="sortData($event)"
       matSort
       class="mat-elevation-z8">
    <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="status"> Statut</th>
        <td mat-cell *matCellDef="let element">
            <app-game-status
                [gameBorrowInformation]="borrowsInformations | filterBorrowById: element"></app-game-status>
        </td>
    </ng-container>
    <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="category">Category</th>
        <td mat-cell *matCellDef="let element">
            <app-badge [status]="element.category"></app-badge>
        </td>
    </ng-container>

    <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="name"> Nom</th>
        <td mat-cell *matCellDef="let element"> {{ element.name }}</td>
    </ng-container>

    <ng-container matColumnDef="poids">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="weight"> poids</th>
        <td mat-cell *matCellDef="let element"> {{ element.weight }}g</td>
    </ng-container>

    <ng-container matColumnDef="ref">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="ref"> ref</th>
        <td mat-cell *matCellDef="let element"> {{ element.ref }}</td>
    </ng-container>

    <ng-container matColumnDef="stats">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="stats"> Taux emrpunt</th>
        <td mat-cell
            *matCellDef="let element"> {{ borrowsInformations | filterBorrowById: element | computeStatistics }}
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
