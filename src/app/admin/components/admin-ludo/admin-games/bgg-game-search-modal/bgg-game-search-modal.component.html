<h1 mat-dialog-title>Sélectionner le bon jeu</h1>
<div mat-dialog-content>
  <mat-selection-list [multiple]="false" (selectionChange)="select($event)">
    @for (game of data.games; track game.attributes.id) {
      <mat-list-option [value]="game">
        {{ game.elements[0].attributes.value }} | {{ game.elements[1].attributes.value }}
      </mat-list-option>
    }
  </mat-selection-list>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="close()">Cancel</button>
  <button mat-button [disabled]="!selectedGame()" [mat-dialog-close]="selectedGame()" cdkFocusInitial>Ok</button>
</div>
