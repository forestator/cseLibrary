<h2 mat-dialog-title>Sélectionner le bon jeu</h2>
<mat-dialog-content>
  <mat-selection-list [multiple]="false" aria-label="Résultats BoardGameGeek"
                      (selectionChange)="select($event)">
    @for (game of data.games; track game.attributes.id) {
      <mat-list-option [value]="game">
        <span class="game-name">{{ game.elements[0].attributes.value }}</span>
        <span class="game-year">{{ game.elements[1].attributes.value }}</span>
      </mat-list-option>
    } @empty {
      <p class="empty">Aucun résultat sur BoardGameGeek.</p>
    }
  </mat-selection-list>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton type="button" (click)="close()">Annuler</button>
  <button matButton="filled" type="button" [disabled]="!selectedGame()" [mat-dialog-close]="selectedGame()" cdkFocusInitial>
    Valider
  </button>
</mat-dialog-actions>
