<h2 mat-dialog-title>Modifier un jeu</h2>
<mat-dialog-content>
  <mat-form-field class="picker-field" appearance="outline">
    <mat-label>Chercher un jeu</mat-label>
    <mat-icon matPrefix aria-hidden="true">search</mat-icon>
    <input matInput placeholder="Splendor" [formControl]="searchText" [matAutocomplete]="auto" type="text">
    <mat-autocomplete #auto="matAutocomplete"
      [displayWith]="displayGame"
      (optionSelected)="selectGameToModify($event)"
      autoActiveFirstOption>
      @for (option of filteredOptions(); track option.category + option.ref) {
        <mat-option [value]="option">
          <app-badge [status]="option.category" />
          {{ option.name }}
        </mat-option>
      } @empty {
        <mat-option disabled>Aucun résultat</mat-option>
      }
    </mat-autocomplete>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button (click)="cancel()" type="button" matButton>Annuler</button>
</mat-dialog-actions>
