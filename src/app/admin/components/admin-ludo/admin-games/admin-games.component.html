<div class="manage-buttons">
  <button mat-raised-button color="primary" id="addGame" (click)="addGame()">Ajouter un jeu</button>
  <button mat-raised-button color="primary" id="editGame" (click)="editGame()">Modifier un jeu</button>
</div>
<mat-divider />
<div class="game-list">
  <mat-accordion>
    @for (section of sections(); track section.title) {
      <mat-expansion-panel>
        <mat-expansion-panel-header>
          <mat-panel-title>{{ section.title }}</mat-panel-title>
        </mat-expansion-panel-header>
        <ng-template matExpansionPanelContent>
          <app-ludo-table [games]="section.games" [displayedColumns]="section.columns" />
        </ng-template>
      </mat-expansion-panel>
    }
  </mat-accordion>
</div>
