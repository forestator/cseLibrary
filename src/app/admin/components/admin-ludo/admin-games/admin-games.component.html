<div class="admin-page">
  <app-catalogue-page-header title="Administration ludothèque" resume="Gestion des jeux de société, jeux vidéo et grands jeux" />

  <div class="admin-toolbar" role="toolbar" aria-label="Actions">
    <button matButton="filled" type="button" id="addGame" (click)="addGame()">
      <mat-icon aria-hidden="true">add</mat-icon>
      Ajouter un jeu
    </button>
    <button matButton="tonal" type="button" id="editGame" (click)="editGame()">
      <mat-icon aria-hidden="true">edit</mat-icon>
      Modifier un jeu
    </button>
  </div>

  <mat-accordion class="admin-panels" multi>
    @for (section of sections(); track section.title) {
      <mat-expansion-panel>
        <mat-expansion-panel-header>
          <mat-panel-title>{{ section.title }}</mat-panel-title>
          <mat-panel-description>{{ section.countLabel }}</mat-panel-description>
        </mat-expansion-panel-header>
        <ng-template matExpansionPanelContent>
          <app-ludo-table [games]="section.games" [displayedColumns]="section.columns" />
        </ng-template>
      </mat-expansion-panel>
    }
  </mat-accordion>
</div>
