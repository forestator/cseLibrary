<div class="manage-buttons">
  <button mat-raised-button color="primary" id="addGame" (click)="addGame()">Ajouter un jeu</button>
  <button mat-raised-button color="primary" id="editGame" (click)="editGame()">Modifier un jeu</button>
</div>
<mat-divider></mat-divider>
<div class="game-list">
  <mat-accordion>
    <mat-expansion-panel (opened)="boardGamePanelOpen = true"
                         (closed)="boardGamePanelOpen = false">
      <mat-expansion-panel-header>
        <mat-panel-title>BoardGames</mat-panel-title>
      </mat-expansion-panel-header>
      <app-ludo-table *ngIf="boardGamePanelOpen"
                      [games]="firebaseDatabaseService.boardGamesOneShot$ | async"
                      [borrowsInformations]="(borrowInformations$ | async)"
                      [displayedColumns]="columnsBoardGames"></app-ludo-table>
    </mat-expansion-panel>

    <mat-expansion-panel (opened)="videoGamePanelOpen = true"
                         (closed)="videoGamePanelOpen = false">
      <mat-expansion-panel-header>
        <mat-panel-title>VideoGames</mat-panel-title>
      </mat-expansion-panel-header>
      <app-ludo-table *ngIf="videoGamePanelOpen"
                      [games]="firebaseDatabaseService.videoGamesOneShot$ | async"
                      [borrowsInformations]="(borrowInformations$ | async)"
                      [displayedColumns]="columnsVideoGame"></app-ludo-table>
    </mat-expansion-panel>

    <mat-expansion-panel (opened)="outsideGamePanelOpen = true"
                         (closed)="outsideGamePanelOpen = false">
      <mat-expansion-panel-header>
        <mat-panel-title>OutsideGames</mat-panel-title>
      </mat-expansion-panel-header>
      <app-ludo-table *ngIf="outsideGamePanelOpen"
                      [games]="firebaseDatabaseService.outsideGamesOneShot$ | async"
                      [borrowsInformations]="(borrowInformations$ | async)"
                      [displayedColumns]="columnsOutsideGame"></app-ludo-table>
    </mat-expansion-panel>
  </mat-accordion>
</div>
