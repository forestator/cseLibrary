<div [class.disable]="loading">
  <h1 mat-dialog-title>Ajouter un jeu</h1>
  <div class="modal-container" mat-dialog-content>
    <app-add-game-form [gameForm]="gameForm" (gameSelected)="makeSomeMagic()" />
  </div>
  <div mat-dialog-actions>
    <button (click)="cancel()" id="cancel" mat-button>Cancel</button>
    <button (click)="addGame()"
      id="save"
      [disabled]="$safeNavigationMigration(gameForm?.invalid)"
      cdkFocusInitial
      mat-button>
      Confirm
    </button>
    <button mat-button
      id="makeMagic"
      [title]="disableMagic() ? 'Ajouter l\'id boardgamegeek et le nom du jeu' : ''"
      [disabled]="disableMagic()"
      (click)="makeSomeMagic()">Remplir automatiquement les champs
    </button>
    <button mat-button
      id="delete"
      color="warn"
      [disabled]="!data.selectedGame"
      (click)="deleteGame()">Delete
    </button>
    @if (loading) {
      <mat-spinner />
    }
  </div>
</div>
