<h2 mat-dialog-title>{{ data.selectedGame ? 'Modifier un jeu' : 'Ajouter un jeu' }}</h2>
@if (loading()) {
  <mat-progress-bar mode="indeterminate" aria-label="Remplissage automatique en cours" />
}
<mat-dialog-content [class.modal-disabled]="loading()">
  <app-add-game-form [gameForm]="gameForm" (gameSelected)="makeSomeMagic()" />
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton type="button" id="delete" class="dialog-delete" [disabled]="!data.selectedGame"
    (click)="deleteGame()">
    <mat-icon aria-hidden="true">delete</mat-icon>
    Supprimer
  </button>
  <button matButton="tonal" type="button" id="makeMagic"
    [title]="magicDisabled() ? 'Ajouter l\'id boardgamegeek et le nom du jeu' : ''"
    [disabled]="magicDisabled()"
    (click)="makeSomeMagic()">
    <mat-icon aria-hidden="true">auto_fix_high</mat-icon>
    Remplir automatiquement les champs
  </button>
  <button matButton type="button" id="cancel" (click)="cancel()">Annuler</button>
  <button matButton="filled" type="button" id="save" [disabled]="formInvalid()" cdkFocusInitial (click)="addGame()">
    Enregistrer
  </button>
</mat-dialog-actions>
