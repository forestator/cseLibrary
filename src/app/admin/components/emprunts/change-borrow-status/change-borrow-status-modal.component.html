<h1 mat-dialog-title>Emprunt du jeu {{data.object.name}}</h1>
<div class="modal-container" mat-dialog-content>
  <mat-form-field appearance="fill" *ngIf="data.users">
    <mat-label>Réservation pour :</mat-label>
    <input [formControl]="employeeSearch" [matAutocomplete]="user" matInput type="text">
    <mat-autocomplete #user="matAutocomplete" (optionSelected)="selectUser($event)"
                      [displayWith]="displayUser"
                      autoActiveFirstOption>
      <mat-option *ngFor="let option of filteredOptionsUser$ | async"
                  [value]="option">
        {{displayUser(option)}}
      </mat-option>
    </mat-autocomplete>
  </mat-form-field>
  <mat-form-field appearance="fill">
    <mat-label>Période d'emprunt</mat-label>
    <mat-date-range-input
      [dateFilter]="dateFilter" [formGroup]="range" [rangePicker]="picker">
      <input matStartDate [readonly]="true"
             formControlName="start"
             placeholder="Date début">
      <input matEndDate [readonly]="true"
             formControlName="end"
             placeholder="Date Fin">
    </mat-date-range-input>
    <mat-hint>DD/MM/YYYY – DD/MM/YYYY</mat-hint>
    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-date-range-picker #picker></mat-date-range-picker>
  </mat-form-field>
  <mat-error *ngIf="range.errors">
    Impossible de réserver plus d'un mois
  </mat-error>
  <mat-error *ngIf="range.get('start').errors || range.get('end').errors">
    Déjà réservé sur ces dates
  </mat-error>
</div>
<div mat-dialog-actions>
  <button type="button" (click)="cancel()" mat-button>Cancel</button>
  <button (click)="borrowGame()"
          type="submit"
          [disabled]="range.invalid && !!selectedUSer"
          cdkFocusInitial
          mat-button>
    Confirm
  </button>
</div>
