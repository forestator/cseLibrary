<div class="search-container">
    <!-- TODO WIP
    <mat-button-toggle-group name="Commission" [(ngModel)]="selectedComission">
        <mat-button-toggle [value]="comissions.LUDOTHEQUE">{{comissions.LUDOTHEQUE}}</mat-button-toggle>
         <mat-button-toggle [value]="comissions.BIBLIOTHEQUE">{{comissions.BIBLIOTHEQUE}}</mat-button-toggle>
        <mat-button-toggle [value]="comissions.BRICOLAGE">{{comissions.BRICOLAGE}}</mat-button-toggle>
    </mat-button-toggle-group>-->
    <div class="controls-container">
        <mat-form-field appearance="fill">
            <mat-label>Employe recherche</mat-label>
            <input [formControl]="employeeSearch" [matAutocomplete]="user" matInput type="text">
            <mat-autocomplete #user="matAutocomplete" (optionSelected)="selectEmployee($event)"
                              [displayWith]="displayUser"
                              autoActiveFirstOption>
                <mat-option *ngFor="let option of filteredOptionsUser$ | async"
                            [value]="option">
                    {{displayUser(option)}}
                </mat-option>
            </mat-autocomplete>
        </mat-form-field>
        <mat-form-field appearance="fill">
            <mat-label>Objet à emprunter</mat-label>
            <input [formControl]="objectSearch" [matAutocomplete]="obj" matInput type="text">
            <mat-autocomplete #obj="matAutocomplete" (optionSelected)="selectObject($event)"
                              [displayWith]="displayObject"
                              autoActiveFirstOption>
                <mat-option *ngFor="let option of filteredOptionsObject$ | async"
                            [value]="option">
                    {{displayObject(option)}}
                </mat-option>
            </mat-autocomplete>
        </mat-form-field>
        <button mat-raised-button
                [disabled]="!selectedUser || (!selectedObject && !borrowAll)"
                (click)="openBorrowModal()">
            Empruter
        </button>
        <button mat-raised-button
                [disabled]="!selectedBorrows() || selectedBorrows().length === 0"
                (click)="selectAllBorrow ? confirmReturnSelectedBorrows() : returnSelectedBorrows()">
            Retour
        </button>
        <div>
            <mat-label>Afficher les emprunts rendus</mat-label>
            <mat-checkbox [(ngModel)]="showReturned"></mat-checkbox>
        </div>
    </div>
</div>
<mat-divider></mat-divider>
<div>
    <app-borrow-table [dataTableSource]="dataTableSource"
                      [(selectAllBorrow)]="selectAllBorrow"
                      [displayedColumns]="displayedColumns"
                      [showReturned]="showReturned"
                      (selectAllBorrowChange)="selectChange()"></app-borrow-table>
</div>
