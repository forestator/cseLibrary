<h2 mat-dialog-title class="confirm-title">
  <mat-icon class="confirm-icon" aria-hidden="true">warning</mat-icon>
  {{ title }}
</h2>
<mat-dialog-content>
  <p class="confirm-text">{{ data.confirmText }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton type="button" [mat-dialog-close]="false" cdkFocusInitial>{{ cancelLabel }}</button>
  <button matButton="filled" type="button" class="confirm-action" [mat-dialog-close]="true">{{ confirmLabel }}</button>
</mat-dialog-actions>
