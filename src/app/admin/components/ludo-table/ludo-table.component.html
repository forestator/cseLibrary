<table *ngIf="dataSource" mat-table [dataSource]="dataSource"
       matSort
       class="mat-elevation-z8">

  <ng-container matColumnDef="borrow">
    <th mat-header-cell *matHeaderCellDef> Emprunter ce jeu</th>
    <td mat-cell *matCellDef="let element">
      <button mat-button color="primary" (click)="borrowGame(element)">
        Emprunter
      </button>
    </td>
  </ng-container>
  <ng-container matColumnDef="return">
    <th mat-header-cell *matHeaderCellDef> Retour</th>
    <td mat-cell *matCellDef="let element">
      <button mat-button color="primary" (click)="returnGame(element)">
        Retour
      </button>
    </td>
  </ng-container>
  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Date emprunt</th>
    <td mat-cell *matCellDef="let element">
      {{element | lastBorrowDates}}
    </td>
  </ng-container>
  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Status</th>
    <td mat-cell *matCellDef="let element">
      <app-badge [status]="element.status"></app-badge>
    </td>
  </ng-container>
  <ng-container matColumnDef="borrowedBy">
    <th mat-header-cell *matHeaderCellDef>Emprunté par</th>
    <td mat-cell *matCellDef="let element">
      {{element | borrowedByUser | async}}
    </td>
  </ng-container>
  <ng-container matColumnDef="category">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Category</th>
    <td mat-cell *matCellDef="let element">
      <app-badge [status]="element.category"></app-badge>
    </td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Name</th>
    <td mat-cell *matCellDef="let element"> {{element.name}} </td>
  </ng-container>

  <ng-container matColumnDef="poids">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Weight</th>
    <td mat-cell *matCellDef="let element"> {{element.poids}} </td>
  </ng-container>

  <ng-container matColumnDef="ref">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> ref</th>
    <td mat-cell *matCellDef="let element"> {{element.ref}} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
