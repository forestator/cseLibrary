<div class="manage-buttons">
  <button mat-raised-button color="primary" (click)="addItem()">Ajouter une nouveauté</button>
  <button mat-raised-button color="primary" (click)="editItem()">Modifier un objet existant</button>
</div>
<mat-divider />
<div class="items-list">
  <mat-accordion>
    @for (sonoCat of sonoCategories; track sonoCat) {
      <mat-expansion-panel
        (opened)="changeOpenCat(sonoCat)">
        <mat-expansion-panel-header>
          <mat-panel-title>{{sonoCat | titlecase}}</mat-panel-title>
        </mat-expansion-panel-header>
        @if (openededCat === sonoCat) {
          <app-sono-table [sonoItems]="openededCatItems$ | async" />
        }
      </mat-expansion-panel>
    }
  </mat-accordion>
</div>
