<h1 mat-dialog-title>Modifier un item de la sonothèque</h1>
<div class="modal-container" mat-dialog-content>
  <mat-form-field>
    <mat-label>Chercher un item</mat-label>
    <input matInput placeholder="Super jeux de lumière" [formControl]="searchText" [matAutocomplete]="auto" type="text">
    <mat-autocomplete #auto="matAutocomplete"
                      [displayWith]="displaySonoItem"
                      (optionSelected)="selectItemToModify($event)"
                      autoActiveFirstOption>
      <mat-option *ngFor="let option of filteredOptions$ | async"
                  [value]="option">
        {{displaySonoItem(option)}}
      </mat-option>
    </mat-autocomplete>
  </mat-form-field>
</div>
<div mat-dialog-actions>
  <button (click)="cancel()" mat-button>Cancel</button>
</div>
