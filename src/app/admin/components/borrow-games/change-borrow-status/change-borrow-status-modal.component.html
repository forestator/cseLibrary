<h1 mat-dialog-title>Changer le status du jeu {{data.game.name}}</h1>
<div class="modal-container" mat-dialog-content>
  <mat-form-field appearance="fill">
    <mat-label>Employé ?</mat-label>
    <input [formControl]="employeeFomControl" [matAutocomplete]="auto"
           matInput
           type="text">
    <mat-autocomplete #auto="matAutocomplete" (optionSelected)="selectEmployee($event)"
                      [displayWith]="displayUser"
                      autoActiveFirstOption>
      <mat-option *ngFor="let option of filterUserAutocomplete$ | async"
                  [value]="option">
        {{displayUser(option)}}
      </mat-option>
    </mat-autocomplete>
  </mat-form-field>
</div>
<div mat-dialog-actions>
  <button (click)="cancel()" mat-button>Cancel</button>
  <button (click)="borrowGame()"
          [disabled]="!selectedEmployee"
          cdkFocusInitial
          mat-button>
    Confirm
  </button>
</div>
