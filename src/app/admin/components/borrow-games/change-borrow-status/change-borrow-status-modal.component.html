<h1 mat-dialog-title>Changer le status du jeu {{data.game.name}}</h1>
<div class="modal-container" mat-dialog-content>
  <mat-form-field appearance="fill">
    <mat-label>Employé ?</mat-label>
    <input [formControl]="employeeFomControl" [matAutocomplete]="auto"
           matInput
           type="text">
    <mat-autocomplete #auto="matAutocomplete" (optionSelected)="selectEmployee($event)"
                      [displayWith]="displayUser"
                      autoActiveFirstOption>
      <mat-option *ngFor="let option of filterUserAutocomplete$ | async"
                  [value]="option">
        {{displayUser(option)}}
      </mat-option>
    </mat-autocomplete>
  </mat-form-field>
  <mat-form-field appearance="fill">
    <mat-label>Période d'emprunt</mat-label>
    <mat-date-range-input
      [dateFilter]="dateFilter" [formGroup]="range" [rangePicker]="picker">
      <input matStartDate [readonly]="true"
             formControlName="start"
             placeholder="Date début">
      <input matEndDate [readonly]="true"
             formControlName="end"
             placeholder="Date Fin">
    </mat-date-range-input>
    <mat-hint>DD/MM/YYYY – DD/MM/YYYY</mat-hint>
    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-date-range-picker #picker></mat-date-range-picker>
  </mat-form-field>
  <mat-error *ngIf="range.invalid">
    Impossible de réserver plus d'un mois
  </mat-error>
</div>
<div mat-dialog-actions>
  <button (click)="cancel()" mat-button>Cancel</button>
  <button (click)="borrowGame()"
          [disabled]="!selectedEmployee || range.invalid"
          cdkFocusInitial
          mat-button>
    Confirm
  </button>
</div>
