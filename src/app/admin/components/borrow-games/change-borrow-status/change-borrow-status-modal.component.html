<h1 mat-dialog-title>Changer le status du jeu {{data.game.name}}</h1>
<div mat-dialog-content class="modal-container" *ngIf="newStatus === 'EMPRUNTE'">
  <mat-form-field appearance="fill">
    <mat-label>Employé ?</mat-label>
    <input type="text" matInput
           [formControl]="employeeFomControl"
           [matAutocomplete]="auto">
    <mat-autocomplete autoActiveFirstOption #auto="matAutocomplete"
                      (optionSelected)="selectEmployee($event)"
                      [displayWith]="displayUser">
      <mat-option *ngFor="let option of filterUserAutocomplete$ | async"
                  [value]="option">
        {{displayUser(option)}}
      </mat-option>
    </mat-autocomplete>
  </mat-form-field>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="cancel()">Cancel</button>
  <button [disabled]="!selectedEmployee"
          mat-button
          (click)="borrowGame()"
          cdkFocusInitial>
    Confirm
  </button>
</div>
