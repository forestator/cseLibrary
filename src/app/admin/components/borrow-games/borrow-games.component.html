<div class="by-user">
  <form class="search-for-user">
    <mat-form-field appearance="fill">
      <mat-label>Employe recherche</mat-label>
      <input [formControl]="employeeSearch" [matAutocomplete]="auto" matInput type="text">
      <mat-autocomplete #auto="matAutocomplete" (optionSelected)="selectEmployee($event)"
                        [displayWith]="displayUser"
                        autoActiveFirstOption>
        <mat-option *ngFor="let option of filteredOptions$ | async"
                    [value]="option">
          {{displayUser(option)}}
        </mat-option>
      </mat-autocomplete>
    </mat-form-field>
  </form>

  <app-ludo-table [displayedColumns]="displayedColumnsGameOfUser"
                  [games]="gameOfUser$ | async"
                  [returnForUser]="selectedUser"
                  [users]="users">
  </app-ludo-table>
</div>
<mat-divider></mat-divider>
<div class="by-game-list">
  <div class="borrow-header">
    <mat-form-field>
      <mat-label>Chercher un jeu</mat-label>
      <input [(ngModel)]="search" matInput placeholder="Splendor">
    </mat-form-field>
  </div>
  <mat-accordion>
    <mat-expansion-panel (closed)="boardGamePanelOpen = false"
                         (opened)="boardGamePanelOpen = true">
      <mat-expansion-panel-header>
        <mat-panel-title>BoardGames</mat-panel-title>
      </mat-expansion-panel-header>
      <app-ludo-table *ngIf="boardGamePanelOpen"
                      [displayedColumns]="displayedColumnsBoardGames"
                      [filterBy]="search"
                      [games]="firebaseDatabaseService.boardGames$ | async"
                      [returnForUser]="selectedUser"
                      [users]="users"></app-ludo-table>
    </mat-expansion-panel>

    <mat-expansion-panel (closed)="videoGamePanelOpen = false"
                         (opened)="videoGamePanelOpen = true">
      <mat-expansion-panel-header>
        <mat-panel-title>VideoGames</mat-panel-title>
      </mat-expansion-panel-header>
      <app-ludo-table *ngIf="videoGamePanelOpen"
                      [displayedColumns]="displayedColumnsVideoGame"
                      [filterBy]="search"
                      [games]="firebaseDatabaseService.videoGames$ | async"
                      [returnForUser]="selectedUser"
                      [users]="users"></app-ludo-table>
    </mat-expansion-panel>

    <mat-expansion-panel (closed)="outsideGamePanelOpen = false"
                         (opened)="outsideGamePanelOpen = true">
      <mat-expansion-panel-header>
        <mat-panel-title>OutsideGames</mat-panel-title>
      </mat-expansion-panel-header>
      <app-ludo-table *ngIf="outsideGamePanelOpen"
                      [displayedColumns]="displayedColumnsOutsideGame"
                      [filterBy]="search"
                      [games]="firebaseDatabaseService.outsideGames$ | async"
                      [returnForUser]="selectedUser"
                      [users]="users"></app-ludo-table>
    </mat-expansion-panel>
  </mat-accordion>
</div>
