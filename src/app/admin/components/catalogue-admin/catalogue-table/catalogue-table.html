@if (items().length) {
  <div class="table-container">
    <table mat-table [dataSource]="dataSource()" matSort>
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Réf.</th>
        <td mat-cell *matCellDef="let element">{{element.id}}</td>
      </ng-container>
      <ng-container matColumnDef="cover">
        <th mat-header-cell *matHeaderCellDef>Photo</th>
        <td mat-cell *matCellDef="let element">
          @if (element.cover) {
            <span class="table-cover">
              <img class="table-cover-image" [ngSrc]="element.cover" [alt]="'Photo de ' + element.name" fill sizes="10vw">
            </span>
          } @else {
            <span class="table-muted">Pas de photo</span>
          }
        </td>
      </ng-container>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nom</th>
        <td mat-cell *matCellDef="let element" class="table-name">{{element.name}}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Statut</th>
        <td mat-cell *matCellDef="let element">
          <app-badge [status]="element.status" />
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
} @else {
  <p class="table-empty" role="status">Aucun élément.</p>
}
