<h2 mat-dialog-title>{{texts.editTitle}}</h2>
<mat-dialog-content>
  <mat-form-field class="picker-field" appearance="outline">
    <mat-label>{{texts.searchLabel}}</mat-label>
    <mat-icon matPrefix aria-hidden="true">search</mat-icon>
    <input matInput [placeholder]="texts.searchPlaceholder" [formControl]="searchText" [matAutocomplete]="auto" type="text">
    <mat-autocomplete #auto="matAutocomplete"
      [displayWith]="displayItem"
      (optionSelected)="selectItem($event)"
      autoActiveFirstOption>
      @for (option of options(); track option.item.categoryId + '/' + option.item.id) {
        <mat-option [value]="option.item">
          @if (data.config.showRef) {
            <b>{{option.item.id}}</b>
          }
          {{option.label}}
        </mat-option>
      } @empty {
        <mat-option disabled>Aucun résultat</mat-option>
      }
    </mat-autocomplete>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button (click)="cancel()" type="button" matButton>Annuler</button>
</mat-dialog-actions>
