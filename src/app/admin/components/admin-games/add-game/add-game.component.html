<div class="game-controls">
  <div class="game-control-header-container search">
    <mat-form-field>
      <mat-label>Chercher un jeu</mat-label>
      <input matInput placeholder="Splendor" [formControl]="searchText" [matAutocomplete]="auto" type="text">
      <mat-autocomplete #auto="matAutocomplete"
                        [displayWith]="displayGame"
                        (optionSelected)="selectGameToModify($event)"
                        autoActiveFirstOption>
        <mat-option *ngFor="let option of filteredOptions$ | async"
                    [value]="option">
          <app-badge [status]="option.category"></app-badge>
          {{displayGame(option)}}
        </mat-option>
      </mat-autocomplete>
    </mat-form-field>
    <div class="image-upload" *ngIf="selectedGame">
      <h4>Image</h4>
      <app-upload-form [selectedGame]="selectedGame"></app-upload-form>
    </div>
  </div>
  <mat-divider [vertical]="true"></mat-divider>
  <form class="game-form game-control-header-container" #ngForm="ngForm" [formGroup]="modifyGameForm">
    <h4>Modifier un jeu</h4>
    <app-add-game-form [gameForm]="modifyGameForm"></app-add-game-form>
    <mat-error *ngIf="ngForm.submitted && modifyGameForm.invalid && modifyGameForm.touched">Formulaire invalid
    </mat-error>
    <button [disabled]="modifyGameForm.untouched" mat-raised-button type="submit" (click)="updateGame()">
      Mettre à jour le jeu
    </button>
  </form>
  <mat-divider [vertical]="true"></mat-divider>
  <form class="game-form game-control-header-container" #ngForm="ngForm" [formGroup]="gameForm">
    <h4>Nouveau jeu</h4>
    <app-add-game-form [gameForm]="gameForm"></app-add-game-form>
    <mat-error *ngIf="ngForm.submitted && gameForm.invalid && gameForm.touched">Formulaire invalid</mat-error>
    <button mat-raised-button
            [disabled]="gameForm.untouched"
            type="submit" (click)="addGame()">
      Ajouter le jeu
    </button>
  </form>
</div>
