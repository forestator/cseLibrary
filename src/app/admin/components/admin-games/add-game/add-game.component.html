<div class="game-controls">
  <mat-form-field class="game-control-header-container search">
    <mat-label>Chercher un jeu</mat-label>
    <input matInput placeholder="Splendor" [formControl]="searchText" [matAutocomplete]="auto" type="text">
    <mat-autocomplete #auto="matAutocomplete"
                      [displayWith]="displayGame"
                      (optionSelected)="selectGameToModify($event)"
                      autoActiveFirstOption>
      <mat-option *ngFor="let option of filteredOptions$ | async"
                  [value]="option">
        <app-badge [status]="option.category"></app-badge>
        {{displayGame(option)}}
      </mat-option>
    </mat-autocomplete>
  </mat-form-field>
  <mat-divider [vertical]="true"></mat-divider>
  <form class="game-form game-control-header-container" #ngForm="ngForm" [formGroup]="modifyGameForm">
    <h4>Modifier un jeu</h4>
    <div class="select-library">
      <mat-button-toggle-group (ngModelChange)="setCategoryOptions($event)"
                               name="libraryId" formControlName="libraryId" aria-label="Font Style">
        <mat-button-toggle value="boardGames">Jeu de Société</mat-button-toggle>
        <mat-button-toggle value="videoGames">Jeux Vidéo</mat-button-toggle>
        <mat-button-toggle value="outsideGames">Grand Jeu</mat-button-toggle>
      </mat-button-toggle-group>
    </div>
    <mat-form-field>
      <mat-label>Nom</mat-label>
      <input matInput placeholder="Splendor" formControlName="name">
    </mat-form-field>
    <mat-form-field>
      <mat-label>Référence</mat-label>
      <input matInput placeholder="ludo1234" formControlName="ref">
    </mat-form-field>
    <mat-form-field appearance="fill">
      <mat-label>Catégorie</mat-label>
      <mat-select formControlName="categoryId">
        <mat-option *ngFor="let cat of categoryOptions" [value]="cat.id">
          <app-badge class="category" [status]="cat.id"></app-badge>
        </mat-option>
      </mat-select>
    </mat-form-field>
    <ng-container *ngIf="modifyGameForm.get('libraryId').value === 'boardGames'">
      <mat-form-field appearance="fill">
        <mat-label>BoardGameGeek Id</mat-label>
        <input matInput type="number" placeholder="123456" formControlName="id">
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>Poids</mat-label>
        <input matInput type="number" placeholder="100" formControlName="weight">
      </mat-form-field>
    </ng-container>
    <mat-error *ngIf="ngForm.submitted && modifyGameForm.invalid && modifyGameForm.touched">Formulaire invalid</mat-error>
    <button mat-button type="submit" (click)="updateGame()">Mettre à jour le jeu</button>
  </form>
  <mat-divider [vertical]="true"></mat-divider>
  <form class="game-form game-control-header-container" #ngForm="ngForm" [formGroup]="gameForm">
    <h4>Nouveau jeu</h4>
    <div class="select-library">
      <mat-button-toggle-group (ngModelChange)="setCategoryOptions($event)"
                               name="libraryId" formControlName="libraryId" aria-label="Font Style">
        <mat-button-toggle value="boardGames">Jeu de Société</mat-button-toggle>
        <mat-button-toggle value="videoGames">Jeux Vidéo</mat-button-toggle>
        <mat-button-toggle value="outsideGames">Grand Jeu</mat-button-toggle>
      </mat-button-toggle-group>
    </div>
    <mat-form-field>
      <mat-label>Nom</mat-label>
      <input matInput placeholder="Splendor" formControlName="name">
    </mat-form-field>
    <mat-form-field>
      <mat-label>Référence</mat-label>
      <input matInput placeholder="ludo1234" formControlName="ref">
    </mat-form-field>
    <mat-form-field appearance="fill">
      <mat-label>Catégorie</mat-label>
      <mat-select formControlName="categoryId">
        <mat-option *ngFor="let cat of categoryOptions" [value]="cat.id">
          <app-badge class="category" [status]="cat.id"></app-badge>
        </mat-option>
      </mat-select>
    </mat-form-field>
    <ng-container *ngIf="gameForm.get('libraryId').value === 'boardGames'">
      <mat-form-field appearance="fill">
        <mat-label>BoardGameGeek Id</mat-label>
        <input matInput type="number" placeholder="123456" formControlName="id">
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>Poids</mat-label>
        <input matInput type="number" placeholder="100" formControlName="weight">
      </mat-form-field>
    </ng-container>
    <mat-error *ngIf="ngForm.submitted && gameForm.invalid && gameForm.touched">Formulaire invalid</mat-error>
    <button mat-button type="submit" (click)="addGame()">Ajouter le jeu</button>
  </form>
</div>
