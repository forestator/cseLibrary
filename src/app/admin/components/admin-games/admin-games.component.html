<div class="game-controls">
  <mat-form-field class="game-control-header-container search">
    <mat-label>Chercher un jeu</mat-label>
    <input matInput placeholder="Splendor" [(ngModel)]="search">
  </mat-form-field>
  <mat-divider [vertical]="true"></mat-divider>
  <form class="game-form game-control-header-container" #ngForm="ngForm" [formGroup]="gameForm">
    <h4>Modifier un jeu</h4>
    <div class="select-library">
      <mat-button-toggle-group (ngModelChange)="setCategoryOptions($event)"
                               name="libraryId" formControlName="libraryId" aria-label="Font Style">
        <mat-button-toggle value="boardGames">Jeu de Société</mat-button-toggle>
        <mat-button-toggle value="videoGames">Jeux Vidéo</mat-button-toggle>
        <mat-button-toggle value="outsideGames">Grand Jeu</mat-button-toggle>
      </mat-button-toggle-group>
    </div>
    <mat-form-field>
      <mat-label>Nom</mat-label>
      <input matInput placeholder="Splendor" formControlName="name">
    </mat-form-field>
    <mat-form-field>
      <mat-label>Référence</mat-label>
      <input matInput placeholder="ludo1234" formControlName="ref">
    </mat-form-field>
    <mat-form-field appearance="fill">
      <mat-label>Catégorie</mat-label>
      <mat-select formControlName="categoryId">
        <mat-option *ngFor="let cat of categoryOptions" [value]="cat.id">
          <app-badge class="category" [status]="cat.id"></app-badge>
        </mat-option>
      </mat-select>
    </mat-form-field>
    <ng-container *ngIf="gameForm.get('libraryId').value === 'boardGames'">
      <mat-form-field appearance="fill">
        <mat-label>BoardGameGeek Id</mat-label>
        <input matInput type="number" placeholder="123456" formControlName="id">
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>Poids</mat-label>
        <input matInput type="number" placeholder="100" formControlName="weight">
      </mat-form-field>
    </ng-container>
    <mat-error *ngIf="ngForm.submitted && gameForm.invalid && gameForm.touched">Formulaire invalid</mat-error>
    <button mat-button type="submit" (click)="addGame()">Ajouter le jeu</button>
  </form>
  <mat-divider [vertical]="true"></mat-divider>
  <form class="game-form game-control-header-container" #ngForm="ngForm" [formGroup]="gameForm">
    <h4>Nouveau jeu</h4>
    <div class="select-library">
      <mat-button-toggle-group (ngModelChange)="setCategoryOptions($event)"
                               name="libraryId" formControlName="libraryId" aria-label="Font Style">
        <mat-button-toggle value="boardGames">Jeu de Société</mat-button-toggle>
        <mat-button-toggle value="videoGames">Jeux Vidéo</mat-button-toggle>
        <mat-button-toggle value="outsideGames">Grand Jeu</mat-button-toggle>
      </mat-button-toggle-group>
    </div>
    <mat-form-field>
      <mat-label>Nom</mat-label>
      <input matInput placeholder="Splendor" formControlName="name">
    </mat-form-field>
    <mat-form-field>
      <mat-label>Référence</mat-label>
      <input matInput placeholder="ludo1234" formControlName="ref">
    </mat-form-field>
    <mat-form-field appearance="fill">
      <mat-label>Catégorie</mat-label>
      <mat-select formControlName="categoryId">
        <mat-option *ngFor="let cat of categoryOptions" [value]="cat.id">
          <app-badge class="category" [status]="cat.id"></app-badge>
        </mat-option>
      </mat-select>
    </mat-form-field>
    <ng-container *ngIf="gameForm.get('libraryId').value === 'boardGames'">
      <mat-form-field appearance="fill">
        <mat-label>BoardGameGeek Id</mat-label>
        <input matInput type="number" placeholder="123456" formControlName="id">
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>Poids</mat-label>
        <input matInput type="number" placeholder="100" formControlName="weight">
      </mat-form-field>
    </ng-container>
    <mat-error *ngIf="ngForm.submitted && gameForm.invalid && gameForm.touched">Formulaire invalid</mat-error>
    <button mat-button type="submit" (click)="addGame()">Ajouter le jeu</button>
  </form>
</div>
<mat-divider></mat-divider>
<div class="game-list">
  <mat-accordion>
    <mat-expansion-panel (opened)="boardGamePanelOpen = true"
                         (closed)="boardGamePanelOpen = false">
      <mat-expansion-panel-header>
        <mat-panel-title>BoardGames</mat-panel-title>
      </mat-expansion-panel-header>
      <app-ludo-table *ngIf="boardGamePanelOpen"
                      [games]="firebaseDatabaseService.boardGames$ | async"
                      [displayedColumns]="columnsBoardGames"></app-ludo-table>
    </mat-expansion-panel>

    <mat-expansion-panel (opened)="videoGamePanelOpen = true"
                         (closed)="videoGamePanelOpen = false">
      <mat-expansion-panel-header>
        <mat-panel-title>VideoGames</mat-panel-title>
      </mat-expansion-panel-header>
      <app-ludo-table *ngIf="videoGamePanelOpen"
                      [games]="firebaseDatabaseService.videoGames$ | async"
                      [filterBy]="search"
                      [displayedColumns]="columnsVideoGame"></app-ludo-table>
    </mat-expansion-panel>

    <mat-expansion-panel (opened)="outsideGamePanelOpen = true"
                         (closed)="outsideGamePanelOpen = false">
      <mat-expansion-panel-header>
        <mat-panel-title>OutsideGames</mat-panel-title>
      </mat-expansion-panel-header>
      <app-ludo-table *ngIf="outsideGamePanelOpen"
                      [games]="firebaseDatabaseService.outsideGames$ | async"
                      [filterBy]="search"
                      [displayedColumns]="columnsOutsideGame"></app-ludo-table>
    </mat-expansion-panel>
  </mat-accordion>
</div>
