<table *ngIf="dataSource" mat-table [dataSource]="dataSource"
       matSort
       class="mat-elevation-z8">

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Statut</th>
    <td mat-cell *matCellDef="let element">
      <app-badge [status]="element.status"></app-badge>
    </td>
  </ng-container>
  <ng-container matColumnDef="cover">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Photo</th>
    <td mat-cell *matCellDef="let element">
      <img *ngIf="element.cover; else noPhoto"
           class="table-image-preview"
           [src]="element.cover" alt="photo" width="50px" height="100">
      <ng-template #noPhoto>Pas de photo</ng-template>
    </td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Nom</th>
    <td mat-cell *matCellDef="let element"> {{element.name}} </td>
  </ng-container>

  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> ref</th>
    <td mat-cell *matCellDef="let element"> {{element.id}} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
