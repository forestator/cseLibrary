<div>
  <h1 mat-dialog-title>Ajouter un outil</h1>
  <div mat-dialog-content class="modal-container" [formGroup]="toolForm">
    <div class="modal-part">
      <mat-form-field>
        <mat-label>Nom</mat-label>
        <input matInput placeholder="Rotototor" formControlName="name">
      </mat-form-field>
      <mat-form-field>
        <mat-label>Référence</mat-label>
        <input matInput placeholder="123" formControlName="id">
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>Catégorie</mat-label>
        <mat-select formControlName="categoryId">
          @for (catId of categoryOptions; track catId) {
            <mat-option [value]="catId">
              {{catId | titlecase}}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>Description</mat-label>
        <textarea matInput formControlName="description"></textarea>
      </mat-form-field>
      <div>
        <mat-label>Status</mat-label>
        <div>
          <mat-button-toggle-group name="status" formControlName="status" aria-label="Font Style">
            <mat-button-toggle value="AVAILABLE">Disponible</mat-button-toggle>
            <mat-button-toggle value="REPARATION">En Réparation</mat-button-toggle>
            <mat-button-toggle value="HS">HS</mat-button-toggle>
          </mat-button-toggle-group>
        </div>
      </div>
    </div>
    <mat-divider [vertical]="true"></mat-divider>
    <app-upload-form [defaultImage]="data?.selectedTool?.cover ?? defaultImageForTool"
      [disabled]="$safeNavigationMigration(toolForm?.invalid)"
      (fileToUploadReady)="upload($event)">
    </app-upload-form>
  </div>
  <div mat-dialog-actions>
    <button (click)="addTool()"
      [disabled]="$safeNavigationMigration(toolForm?.invalid)"
      cdkFocusInitial
      mat-button>
      Confirm
    </button>
    <button (click)="cancel()" mat-button>Cancel</button>
    @if (data?.selectedTool) {
      <button
        (click)="deleteTool(data!.selectedTool)"
        color="warn"
        cdkFocusInitial
        mat-button>
        Delete
      </button>
    }
  </div>
</div>
