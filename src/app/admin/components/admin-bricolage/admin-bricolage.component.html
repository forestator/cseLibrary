<!-- TODO problème quand on ne ferme pas l'accordin et qu'on ouvre directement un autre les objets ne sont pas affichés -->
<div class="manage-buttons">
  <button mat-raised-button color="primary" (click)="addTool()">Ajouter un nouvel outil</button>
  <button mat-raised-button color="primary" (click)="editTool()">Modifier un outil existant</button>
</div>
<mat-divider />
<div class="items-list">
  <mat-accordion>
    @for (brico of bricoCategories; track brico) {
      <mat-expansion-panel
        (opened)="openededCat = brico"
        (closed)="openededCat = null">
        <mat-expansion-panel-header>
          <mat-panel-title>{{brico | titlecase}}</mat-panel-title>
        </mat-expansion-panel-header>
        @if (openededCat === brico) {
          <app-brico-table [tools]="toolsOfCategory(brico) | async" />
        }
      </mat-expansion-panel>
    }
  </mat-accordion>
</div>
