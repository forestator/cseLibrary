<h1 mat-dialog-title>Modifier un outil</h1>
<div class="modal-container" mat-dialog-content>
  <mat-form-field>
    <mat-label>Chercher un outil</mat-label>
    <input matInput placeholder="Super perceuse" [formControl]="searchText" [matAutocomplete]="auto" type="text">
    <mat-autocomplete #auto="matAutocomplete"
      [displayWith]="displayTool"
      (optionSelected)="selectToolToModify($event)"
      autoActiveFirstOption>
      @for (option of filteredOptions$ | async; track option) {
        <mat-option
          [value]="option">
          <b>{{option.id}}</b>{{displayTool(option)}}
        </mat-option>
      }
    </mat-autocomplete>
  </mat-form-field>
</div>
<div mat-dialog-actions>
  <button (click)="cancel()" mat-button>Cancel</button>
</div>
