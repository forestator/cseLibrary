<div class="core-page fadein">
  @if (category$ | async; as category) {
    <div class="core-header">
      <div class="core-title">
        <div class="primary">{{category.name}}</div>
      </div>
      <div class="core-resume">
        {{category.resume}}
      </div>
    </div>
  }
  @for (sonoItem of categoryItems$ | async; track sonoItem; let index = $index) {
    <div class="core-body">
      <app-sono-item-row [sonoItem]="sonoItem" [index]="index" [selectedSonoItemId]="searchedSonoItemId" />
    </div>
  }
</div>
