<div class="core-page fadein">
  <div class="core-header" *ngIf="category$ | async as category">
    <div class="core-title">
      <div class="primary">{{category.name}}</div>
    </div>
    <div class="core-resume">
      {{category.resume}}
    </div>
  </div>
  <div *ngFor="let sonoItem of categoryItems$ | async; let index = index" class="core-body">
    <app-sono-item-row [sonoItem]="sonoItem" [index]="index" [selectedSonoItemId]="searchedSonoItemId"></app-sono-item-row>
  </div>
</div>
