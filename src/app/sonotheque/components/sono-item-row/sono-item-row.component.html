<div [id]="sonoItem.id" *ngIf="sonoItem" class="book-core">
  <ng-container [ngTemplateOutlet]="image"
                *ngIf="(parity || (toolsService.mobilePhoneDisplay$ | async))"></ng-container>
  <div class="book-infos">
    <div class="book-title">{{sonoItem.name}}
      <app-badge [status]="sonoItem.status"></app-badge>
    </div>
    <div class="book-info">Ref: {{sonoItem.id}}</div>
    <div class="book-info" *ngIf="sonoItem.description">Description: {{sonoItem.description}}</div>
  </div>
  <ng-container [ngTemplateOutlet]="image"
                *ngIf="!parity && !(toolsService.mobilePhoneDisplay$ | async)"></ng-container>
</div>

<ng-template #image>
  <div class="book-cover">
    <img [src]="sonoItem.cover ?? defaultImage" [alt]="sonoItem.name"/>
  </div>
</ng-template>
