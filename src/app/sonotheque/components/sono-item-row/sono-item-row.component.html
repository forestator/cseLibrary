@if (sonoItem()) {
  <div [id]="sonoItem().id" class="book-core">
    @if ((parity || (toolsService.mobilePhoneDisplay$ | async))) {
      <ng-container [ngTemplateOutlet]="image"
       />
    }
    <div class="book-infos">
      <div class="book-title">{{sonoItem().name}}
        <app-badge [status]="sonoItem().status" />
      </div>
      <div class="book-info">Ref: {{sonoItem().id}}</div>
      @if (sonoItem().description) {
        <div class="book-info">Description: {{sonoItem().description}}</div>
      }
    </div>
    @if (!parity && !(toolsService.mobilePhoneDisplay$ | async)) {
      <ng-container [ngTemplateOutlet]="image"
       />
    }
  </div>
}

<ng-template #image>
  <div class="book-cover">
    <img [src]="sonoItem().cover ?? defaultImage" [alt]="sonoItem().name"/>
  </div>
</ng-template>
