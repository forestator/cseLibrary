<div class="card-cover">
  <img class="card-image" [ngSrc]="imageSrc()" [alt]="item().name" fill [priority]="priority()"
       sizes="(max-width: 600px) 90vw, 25vw" (error)="coverFailed.set(true)">
</div>
<div class="card-body">
  <h2 class="card-title">{{ item().name }}</h2>
  <div class="card-chips">
    <app-badge [status]="item().status" />
    @if (config().showRef) {
      <span class="card-chip">Réf. {{ item().id }}</span>
    }
  </div>
  @if (hasDetails()) {
    <button type="button" class="card-toggle" [attr.aria-expanded]="open()" [attr.aria-controls]="panelId"
            (click)="toggle()">
      Détails
      <mat-icon class="card-toggle-icon" aria-hidden="true">expand_more</mat-icon>
    </button>
    @if (open()) {
      <dl class="card-details" [id]="panelId">
        @for (detail of details(); track detail.label) {
          <div class="card-detail">
            <dt>{{ detail.label }}</dt>
            <dd>{{ detail.value }}</dd>
          </div>
        }
      </dl>
    }
  }
</div>
