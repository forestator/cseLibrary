<div class="search">
  <mat-icon class="search-icon" aria-hidden="true">search</mat-icon>
  <input type="search" class="search-input" autocomplete="off"
         [attr.aria-label]="placeholder()"
         [placeholder]="placeholder()"
         [formControl]="searchText"
         [matAutocomplete]="auto">
  <mat-autocomplete autoActiveFirstOption #auto="matAutocomplete"
    [displayWith]="displayItem"
    (optionSelected)="goToSelectedItem($event)">
    @for (option of filteredItems(); track option.categoryId + '/' + option.id) {
      <mat-option [value]="option">
        {{option.name}}
      </mat-option>
    }
  </mat-autocomplete>
</div>
