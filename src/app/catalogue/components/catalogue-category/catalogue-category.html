<div class="core-page fadein">
  @if (category(); as category) {
    <div class="core-header">
      <div class="core-title">
        <div class="primary" role="heading" aria-level="1">{{category.name}}</div>
      </div>
      <div class="core-resume">
        {{category.resume}}
      </div>
    </div>
  }
  @for (item of items(); track item.id; let index = $index) {
    <div class="core-body">
      <app-catalogue-item-row [item]="item" [config]="config()" [index]="index" />
    </div>
  }
</div>
