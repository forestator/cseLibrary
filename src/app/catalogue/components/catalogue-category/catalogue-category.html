<div class="catalogue-page">
  <app-catalogue-page-header [title]="category()?.name" [resume]="category()?.resume" [countLabel]="itemsCountLabel()" />

  @if (categories().length > 1) {
    <nav class="category-nav" aria-label="Autres catégories">
      @for (other of categories(); track other.id) {
        <a class="category-chip" [routerLink]="['..', other.id]"
           [attr.aria-current]="other.id === categoryId() ? 'page' : null">{{ other.name }}</a>
      }
    </nav>
  }

  <app-catalogue-item-grid [items]="items()" [config]="config()" [selectedId]="id()" />
</div>
