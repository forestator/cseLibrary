<div class="core-page fadein">
  <div class="core-header" *ngIf="category$ | async as category">
    <div class="core-title">
      <div class="primary">{{category.name}}</div>
    </div>
    <div class="core-resume">
      {{category.resume}}
    </div>
  </div>
  <div *ngFor="let tool of categoryTools$ | async; let index = index" class="core-body">
    <app-tool-row [tool]="tool" [index]="index" [selectedTool]="searchedToolId"></app-tool-row>
  </div>
</div>
