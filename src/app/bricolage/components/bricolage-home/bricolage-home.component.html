<div class="core-page fadein" *ngIf="bricoLibrary$ | async as library">
  <div class="core-header">
    <div class="core-title">
      <div class="primary">{{library.name}}</div>
    </div>
    <div class="core-resume">
      {{library.resume}}
    </div>
  </div>
  <div *ngFor="let category of library?.categories"
       [routerLink]="category.id" routerLinkActive="active"
       class="core-body core-body-category"
       title="Cliquez ici pour visualiser cette categorie">
    <div *ngIf="!(toolsService.mobilePhoneDisplay$ | async) && category.bg">
      <img class="category-visuel" src="{{category.bg}}"
           alt="{{category.name}}">
    </div>
    <div class="core-header">
      <img *ngIf="(toolsService.mobilePhoneDisplay$ | async) && category.bg"
           alt="{{category.name}}"
           class="category-visuel small-display" src="{{category.bg}}">
      <div class="core-title">
        <div class="primary">
          {{category.name}}
        </div>
      </div>
      <div class="core-resume">
        {{category.resume}}
      </div>
    </div>
  </div>
</div>
