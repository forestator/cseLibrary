<div class="page">
  <app-page-header [title]="library()?.name ?? ''" [resume]="library()?.resume"
    [count]="categoryCount()" backLink="/ludotheque" backLabel="Ludothèque" />
  <app-game-grid [loading]="library() === undefined" [empty]="categories().length === 0" emptyMessage="Aucune catégorie pour le moment.">
    @for (category of currentCategories(); track category.id) {
      <app-tile-card [priority]="$index < 4" [route]="category.id!" [title]="category.name" [resume]="category.resume" [image]="category.bg" />
    }
  </app-game-grid>
  @if (legacyCategories().length) {
    <section class="legacy">
      <app-section-title title="Anciennes consoles" [count]="legacyCategories().length" />
      <ul class="legacy-list">
        @for (category of legacyCategories(); track category.id) {
          <li><a class="legacy-link" [routerLink]="category.id">{{ category.name }}</a></li>
        }
      </ul>
    </section>
  }
</div>
