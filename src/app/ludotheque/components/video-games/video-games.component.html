@if (library$ | async; as library) {
  <div class="core-page fadein">
    <div class="core-header">
      <div class="core-title">
        <div class="primary">{{library.name}}</div>
      </div>
      <div class="core-resume">
        {{library.resume}}
      </div>
    </div>
    @for (category of library?.categories; track category) {
      <div
        [routerLink]="category.id" routerLinkActive="active"
        class="core-body core-body-category"
        [id]="category.id"
        title="Cliquez ici pour visualiser cette categorie">
        <div>
          @if (!(tools.mobilePhoneDisplay$ | async)) {
            <img class="category-visuel"
              src="{{category.bg}}"
              [alt]="library.name">
          }
        </div>
        <div class="core-header">
          @if ((tools.mobilePhoneDisplay$ | async)) {
            <img class="category-visuel small-display"
              src="{{category.bg}}"
              [alt]="library.name">
          }
          <div class="core-title">
            <div class="primary">
              {{category.name}}
            </div>
          </div>
          <div class="core-resume">
            {{category.resume}}
          </div>
        </div>
      </div>
    }
  </div>
}
