@if (videoGames()) {
  <div class="core-page">
    @for (section of hardwareSections(); track section.title) {
      <div class="core-header">
        <div class="core-title">
          <div class="primary">{{ section.title }}</div>
        </div>
      </div>
      @for (videoGame of section.videoGames; track videoGame.ref) {
        <div class="core-body">
          <app-video-game-row [videoGame]="videoGame" [variant]="section.variant"
            [selectedId]="selectedId()" />
        </div>
      }
      <mat-divider />
    }
    <div class="core-header">
      <div class="core-title">
        <div class="primary">Jeux</div>
      </div>
    </div>
    <div class="core-body video-game-list">
      @for (videoGame of games(); track videoGame.ref) {
        <div class="core-body">
          <app-video-game-row [videoGame]="videoGame" [selectedId]="selectedId()" />
        </div>
      }
    </div>
  </div>
}
