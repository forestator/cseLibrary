@if (!videoGames()) {
  <app-game-grid [loading]="true" />
} @else if (sections().length === 0) {
  <app-game-grid [empty]="true" emptyMessage="Aucun jeu vidéo pour le moment." />
} @else {
  @for (section of sections(); track section.title) {
    <section>
      <app-section-title [title]="section.title" [count]="section.videoGames.length" />
      <app-game-grid>
        @for (videoGame of section.videoGames; track videoGame.ref) {
          <app-game-card [priority]="$index < 4" [game]="videoGame" [selectedId]="selectedId()" [showCategory]="showCategory()"
            [description]="videoGame.description" />
        }
      </app-game-grid>
    </section>
  }
}
