<div [id]="videoGame.ref" class="video-game-core">
  <ng-container [ngTemplateOutlet]="image"></ng-container>
  <div class="video-game-info">
    <div class="video-game-title">{{videoGame.name}}</div>
    <button mat-raised-button *ngIf="!borrowsInfo || borrowsInfo?.status === borrowStatus.RETURNED; else borrowsInfoStatus"
            (click)="reserveVideoGame(videoGame)">Réserver</button>
    <ng-template #borrowsInfoStatus>
      <app-badge [status]="borrowsInfo.status"></app-badge>
    </ng-template>
    <div class="" *ngIf="videoGame.ref">Ref: {{videoGame.ref}}</div>
  </div>
</div>
<ng-template #image>
  <div class="book-cover" *ngIf="videoGame.cover">
    <img width="120" height="200"
         [src]="videoGame.cover"
         [alt]="videoGame.name + ' cover'"/>
  </div>
</ng-template>
