<div class="core-page fadein">
  <div class="core-header"
    [routerLink]="'boardGames'">
    <img class="category-visuel small-display"
      src="https://res.cloudinary.com/seo9axkp/image/upload/assets/categories/ludo/categorie%20jeux%20de%20societe"
      alt="Jeux de société">
    <div>
      <div class="core-title">
        <div class="primary">Jeux de société</div>
      </div>
      <div class="core-resume">
        Les j2s
      </div>
    </div>
  </div>
  <div class="core-header"
    [routerLink]="'videoGames'">
    <img class="category-visuel small-display"
      src="https://res.cloudinary.com/seo9axkp/image/upload/assets/categories/ludo/categorie%20jeux%20video"
      alt="Jeux de société">
    <div>
      <div class="core-title">
        <div class="primary">Jeux vidéos</div>
      </div>
      <div class="core-resume">
        Les jeux vidéo !
      </div>
    </div>
  </div>
  <div class="core-header"
    [routerLink]="'outsideGames'">
    <img class="category-visuel small-display"
      src="https://res.cloudinary.com/seo9axkp/image/upload/assets/categories/ludo/categorie%20jeux%20bois"
      alt="Jeux de société">
    <div>
      <div class="core-title">
        <div class="primary">Grands jeux</div>
      </div>
      <div class="core-resume">
        Pas forcément jeux pour grands !
      </div>
    </div>
  </div>
  @if (authService.isUserLudoAdmin$ | async) {
    <div class="core-header">
      <div>
        <div class="core-title">
          <div class="primary">Administration ludotheque</div>
        </div>
        <div class="core-body" [routerLink]="'admin/games'">
          Gestion des jeux
        </div>
      </div>
    </div>
  }
</div>
