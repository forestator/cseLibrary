<div class="core-page fadein">
  @for (entry of entries; track entry.route) {
    <a class="core-header entry-link" [routerLink]="entry.route">
      <img class="category-visuel small-display" [src]="entry.image" [alt]="entry.title">
      <div>
        <div class="core-title">
          <div class="primary">{{ entry.title }}</div>
        </div>
        <div class="core-resume">
          {{ entry.resume }}
        </div>
      </div>
    </a>
  }
  @if (isLudoAdmin()) {
    <div class="core-header">
      <div>
        <div class="core-title">
          <div class="primary">Administration ludotheque</div>
        </div>
        <a class="core-body entry-link" routerLink="admin/games">
          Gestion des jeux
        </a>
      </div>
    </div>
  }
</div>
