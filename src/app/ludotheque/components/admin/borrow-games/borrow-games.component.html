<mat-accordion>
  <mat-expansion-panel>
    <mat-expansion-panel-header>
      <mat-panel-title>BoardGames</mat-panel-title>
    </mat-expansion-panel-header>
    <table mat-table [dataSource]="firebaseDatabaseService.boardGames$"
           matSort
           class="mat-elevation-z8">

      <ng-container matColumnDef="status" >
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Status</th>
        <td mat-cell *matCellDef="let boardGame">
          <app-badge [status]="boardGame.status"></app-badge>
        </td>
      </ng-container>
      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Category</th>
        <td mat-cell *matCellDef="let boardGame"> <app-badge [status]="boardGame.category"></app-badge> </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Name</th>
        <td mat-cell *matCellDef="let boardGame"> {{boardGame.name}} </td>
      </ng-container>

      <ng-container matColumnDef="poids">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Weight</th>
        <td mat-cell *matCellDef="let boardGame"> {{boardGame.poids}} </td>
      </ng-container>

      <ng-container matColumnDef="ref">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> ref</th>
        <td mat-cell *matCellDef="let boardGame"> {{boardGame.ref}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

  </mat-expansion-panel>

  <mat-expansion-panel>
    <mat-expansion-panel-header>
      <mat-panel-title>VideoGames</mat-panel-title>
    </mat-expansion-panel-header>
    <table mat-table [dataSource]="firebaseDatabaseService.videoGames$"
           matSort
           class="mat-elevation-z8">

      <ng-container matColumnDef="status" >
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Status</th>
        <td mat-cell *matCellDef="let videoGame">
          <app-badge [status]="videoGame.status"></app-badge>
        </td>
      </ng-container>
      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Console</th>
        <td mat-cell *matCellDef="let videoGame"> <app-badge [status]="videoGame.category"></app-badge> </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Name</th>
        <td mat-cell *matCellDef="let videoGame"> {{videoGame.name}} </td>
      </ng-container>

      <ng-container matColumnDef="ref">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> ref</th>
        <td mat-cell *matCellDef="let videoGame"> {{videoGame.ref}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumnsVideoGame"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumnsVideoGame;"></tr>
    </table>
  </mat-expansion-panel>

  <mat-expansion-panel>
    <mat-expansion-panel-header>
      <mat-panel-title>OutsideGames</mat-panel-title>
    </mat-expansion-panel-header>
    <table mat-table [dataSource]="firebaseDatabaseService.boardGames$"
           matSort
           class="mat-elevation-z8">

      <ng-container matColumnDef="status" >
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Status</th>
        <td mat-cell *matCellDef="let boardGame">
          <app-badge [status]="boardGame.status"></app-badge>
        </td>
      </ng-container>
      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Category</th>
        <td mat-cell *matCellDef="let boardGame"> <app-badge [status]="boardGame.category"></app-badge> </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Name</th>
        <td mat-cell *matCellDef="let boardGame"> {{boardGame.name}} </td>
      </ng-container>

      <ng-container matColumnDef="poids">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Weight</th>
        <td mat-cell *matCellDef="let boardGame"> {{boardGame.poids}} </td>
      </ng-container>

      <ng-container matColumnDef="ref">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> ref</th>
        <td mat-cell *matCellDef="let boardGame"> {{boardGame.ref}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-expansion-panel>
</mat-accordion>
