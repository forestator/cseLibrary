<h1 mat-dialog-title>Changer le status du jeu {{data.boardGame.name}}</h1>
<div mat-dialog-content class="modal-container">
  <mat-form-field appearance="fill">
    <mat-label>Employé ?</mat-label>
    <input type="text" matInput
           [formControl]="employeeFomControl"
           [matAutocomplete]="auto">
    <mat-autocomplete autoActiveFirstOption #auto="matAutocomplete"
                      (optionSelected)="selectEmployee($event)"
                      [displayWith]="displayUser">
      <mat-option *ngFor="let option of filterUserAutocomplete$ | async"
                  [value]="option">
        {{displayUser(option)}}
      </mat-option>
    </mat-autocomplete>
  </mat-form-field>
  <div class="status">
    <mat-label>New Status</mat-label>
    <mat-button-toggle-group [(ngModel)]="newStatus" aria-label="Status">
      <mat-button-toggle *ngFor="let status of statusOptions" [value]="status">{{status}}</mat-button-toggle>
    </mat-button-toggle-group>
  </div>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="cancel()">Cancel</button>
  <button [disabled]="!selectedEmployee || newStatus === data.boardGame.status"
          mat-button
          (click)="borrowGame()"
          cdkFocusInitial>
    Valid
  </button>
  <button mat-button
          (click)="addNewEmployee()">
    Ajouter un nouvel employé
  </button>
</div>
