<app-search-box inputId="ludoSearch" label="Rechercher un jeu" [options]="filteredOptions()" [displayWith]="displayGame"
  (queryChange)="query.set($event)" (selected)="goToSelectedItem($event)">
  <ng-template let-option>
    <span class="search-option">
      <span class="search-option-category">{{ option.category | gameCategoryLabel }}</span>
      {{ option.name }}
    </span>
  </ng-template>
</app-search-box>
