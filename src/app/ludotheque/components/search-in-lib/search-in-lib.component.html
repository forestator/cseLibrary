<mat-form-field appearance="fill">
  <input type="text"
         placeholder="Search game"
         matInput
         [formControl]="searchText"
         [matAutocomplete]="auto">
  <button matSuffix mat-icon-button aria-label="advanced">
    <mat-icon class="param-icon">filter_list</mat-icon>
  </button>
  <mat-autocomplete autoActiveFirstOption #auto="matAutocomplete"
                    [displayWith]="displayGame"
                    (optionSelected)="goToSelectedItem($event)">
    <mat-option *ngFor="let option of filteredOptions$ | async" [value]="option">
      <app-badge class="badge" [status]="option.category"></app-badge>
      {{option.name}}
    </mat-option>
  </mat-autocomplete>
</mat-form-field>
