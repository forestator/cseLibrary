<div class="core-page fadein">
  <div class="core-header" *ngIf="library$ | async as library">
    <div class="core-title">
      <div class="primary">{{library.name}}</div>
    </div>
    <div class="core-resume">
      {{library.resume}}
    </div>
  </div>
  <div *ngFor="let game of games$ | async; let index = index" class="core-body">
    <app-game-row [game]="game" [index]="index"></app-game-row>
  </div>
</div>
