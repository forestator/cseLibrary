<div class="core-page fadein">
  @if (library$ | async; as library) {
    <div class="core-header">
      <div class="core-title">
        <div class="primary">{{library.name}}</div>
      </div>
      <div class="core-resume">
        {{library.resume}}
      </div>
    </div>
  }
  @for (game of games$ | async; track game; let index = $index) {
    <div class="core-body">
      <app-game-row [game]="game"
        [selectedGame]="selectedOutsideGame"
        [index]="index">
      </app-game-row>
    </div>
  }
</div>
