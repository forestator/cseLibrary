<div class="page">
  <app-page-header [title]="library()?.name ?? 'Grands jeux'" [resume]="library()?.resume" [count]="count()"
    backLink="/ludotheque" backLabel="Ludothèque" />
  <h2 class="visually-hidden">Jeux</h2>
  <app-game-grid [loading]="!games()" [empty]="games()?.length === 0">
    @for (game of games(); track game.ref) {
      <app-game-card [priority]="$index < 8" [game]="game" [selectedId]="id()" [showCategory]="false" [description]="game.description" />
    }
  </app-game-grid>
</div>
