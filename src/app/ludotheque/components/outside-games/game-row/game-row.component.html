<div [id]="game.ref" *ngIf="game" class="book-core">
  <ng-container [ngTemplateOutlet]="image" *ngIf="(parity || (toolsService.mobilePhoneDisplay | async))"></ng-container>
  <div class="book-infos">
    <div class="book-title">{{game.name}}
      <app-game-status class="badge" [game]="game"></app-game-status>
      <!--<button mat-raised-button (click)="borrowGame(game)">Réserver</button>-->
    </div>
    <div class="book-info" *ngIf="game.ref">Ref: {{game.ref}}</div>
    <app-futur-reservations [game]="game"></app-futur-reservations>
  </div>
  <ng-container [ngTemplateOutlet]="image" *ngIf="!parity && !(toolsService.mobilePhoneDisplay | async)"></ng-container>
</div>

<ng-template #image>
  <div class="book-cover" *ngIf="game.cover">
    <img [src]="game.cover" [alt]="game.name"/>
  </div>
</ng-template>
