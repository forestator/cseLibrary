@if (game()) {
  <div [id]="game().ref" class="book-core">
    @if ((parity || (toolsService.mobilePhoneDisplay$ | async))) {
      <ng-container [ngTemplateOutlet]="image"></ng-container>
    }
    <div class="book-infos">
      <div class="book-title">{{game().name}}
      </div>
      @if (game().ref) {
        <div class="book-info">Ref: {{game().ref}}</div>
      }
    </div>
    @if (!parity && !(toolsService.mobilePhoneDisplay$ | async)) {
      <ng-container [ngTemplateOutlet]="image"></ng-container>
    }
  </div>
}

<ng-template #image>
  @if (game().cover) {
    <div class="book-cover">
      <img [src]="game().cover" [alt]="game().name"/>
    </div>
  }
</ng-template>
