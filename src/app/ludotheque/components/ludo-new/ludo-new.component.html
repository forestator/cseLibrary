<app-page-header title="Nouveautés" resume="Les derniers arrivages de la ludothèque."
  backLink="/ludotheque" backLabel="Ludothèque" />
<section>
  <app-section-title title="Jeux de société" [count]="boardGames()?.length" />
  <app-board-game-category-details [boardGames]="boardGames()" emptyMessage="Pas de nouveau jeu de société." />
</section>
<section>
  <app-section-title title="Jeux vidéo" [count]="videoGames()?.length" />
  <app-game-grid [loading]="!videoGames()" [empty]="videoGames()?.length === 0" emptyMessage="Pas de nouveau jeu vidéo.">
    @for (videoGame of videoGames(); track videoGame.ref) {
      <app-game-card [priority]="$index < 4" [game]="videoGame" [description]="videoGame.description" />
    }
  </app-game-grid>
</section>
<section>
  <app-section-title title="Grands jeux" [count]="outsideGames()?.length" />
  <app-game-grid [loading]="!outsideGames()" [empty]="outsideGames()?.length === 0" emptyMessage="Pas de nouveau grand jeu.">
    @for (game of outsideGames(); track game.ref) {
      <app-game-card [priority]="$index < 4" [game]="game" [showCategory]="false" [description]="game.description" />
    }
  </app-game-grid>
</section>
