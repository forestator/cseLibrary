<div class="new-page fadein">
  <div id="new">
    <h1 class="title">Nouveautés</h1>
    <div class="core-page">
      <div class="core-header">
        <div class="core-title">
          <div class="primary">Nouveaux Jeux de société</div>
        </div>
      </div>
      <app-board-game-category-details [boardGames]="boardGames()" />
      <div class="core-header">
        <div class="core-title">
          <div class="primary">Nouveaux Jeux vidéos</div>
        </div>
      </div>
      <app-video-games-console-details class="core-body" [videoGames]="videoGames()" />
      <div class="core-header">
        <div class="core-title">
          <div class="primary">Nouveaux Jeux Grands jeux</div>
        </div>
      </div>
      @for (game of outsideGames(); track game.ref) {
        <div class="core-body">
          <app-game-row [game]="game" [index]="$index" />
        </div>
      }
    </div>
  </div>
</div>
