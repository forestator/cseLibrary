<div class="library-menu" id="top">
  <div class="library-title">
    <div class="title">
      <span [routerLink]="''">Cse</span>
    </div>
    <ng-container *ngIf="menu$ | async as menu">
      <div class="menu" *ngIf="menu.length > 0">
        <button mat-icon-button [matMenuTriggerFor]="mainMenu">
          <mat-icon>view_headline</mat-icon>
        </button>
        <mat-menu #mainMenu="matMenu">
          <button
            mat-menu-item
            *ngFor="let item of menu"
            [routerLink]="item.route">
            <span class="popup-menu-label">{{item.name}}</span>
          </button>
        </mat-menu>
      </div>
    </ng-container>
  </div>
  <div class="category-menu">
    <div class="search" *ngIf="prefixRoute.includes('j2s') || prefixRoute.includes('videoGames')">
      <app-search-in-lib
        [videoGames]="firebaseDatabaseService.videoGamesOneShot$ | async"
        [boardGames]="firebaseDatabaseService.boardGamesOneShot$ | async">
      </app-search-in-lib>
    </div>
    <div class="cat-nav" *ngIf="prefixRoute !== '/'"
         [routerLink]="prefixRoute + 'new'">
      Nouveautés
    </div>
  </div>
</div>
