<div class="core-body" *ngIf="boardGames">
  <ng-container *ngFor="let bg of (boardGames | advancedBoardGameFilter | async); let index = index; trackBy: trackBoardGame">
    <div class="core-body">
      <app-board-game-row
        [boardGame]="bg"
        [selectedBoardGameId]="selectedBoardGameId"
        [index]="index"></app-board-game-row>
    </div>
  </ng-container>
</div>
