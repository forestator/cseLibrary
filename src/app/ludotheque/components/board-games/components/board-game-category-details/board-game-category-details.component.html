<app-game-grid [loading]="!boardGames()" [empty]="boardGames()?.length === 0" [emptyMessage]="emptyMessage()">
  @for (boardGame of boardGames(); track boardGame.ref) {
    @let infos = boardGame | boardGameInfos;
    <app-game-card [priority]="$index < 4" [game]="boardGame" [anchorId]="boardGame.id" [selectedId]="selectedId()"
      [showCategory]="showCategory()" [facts]="infos.facts" [details]="infos.details"
      [description]="boardGame.description" />
  }
</app-game-grid>
