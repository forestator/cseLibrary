@if (filteredBoardGames(); as boardGames) {
  <div class="core-body">
    @for (boardGame of boardGames; track boardGame.ref) {
      <div class="core-body">
        <app-game-row [game]="boardGame" [index]="$index"
          [anchorId]="boardGame.id" [selectedId]="selectedId()"
          [infos]="boardGame | boardGameInfos" [description]="boardGame.description" />
      </div>
    }
  </div>
}
