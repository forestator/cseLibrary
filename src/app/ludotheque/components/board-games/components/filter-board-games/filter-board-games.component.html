@for (group of groups; track group.type) {
  <div class="filter-group">
    <div class="filter-header">
      <mat-icon aria-hidden="true">{{ group.icon }}</mat-icon>
      {{ group.title }}
    </div>
    <div class="number-list">
      <mat-button-toggle-group [(value)]="group.selected" [aria-label]="group.ariaLabel">
        @for (option of group.options; track option) {
          <mat-button-toggle [value]="option" (click)="selectedFilter(group, option)">{{ option }}{{ group.unit }}</mat-button-toggle>
        }
      </mat-button-toggle-group>
    </div>
  </div>
}
