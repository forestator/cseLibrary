<p class="filter-title">Filtres</p>
@for (group of groups(); track group.type) {
  <div class="filter-group" role="group" [attr.aria-labelledby]="'filter-' + group.type">
    <p class="filter-header" [id]="'filter-' + group.type">
      <mat-icon aria-hidden="true">{{ group.icon }}</mat-icon>
      {{ group.title }}
    </p>
    <div class="filter-chips">
      @for (option of group.options; track option.value) {
        <button type="button" class="filter-chip" [class.filter-chip-selected]="option.pressed"
          [attr.aria-pressed]="option.pressed" (click)="toggle(group.type, option.value)">{{ option.label }}</button>
      }
    </div>
  </div>
}
@if (hasFilter()) {
  <button type="button" class="filter-reset" (click)="reset()">
    <mat-icon aria-hidden="true">filter_alt_off</mat-icon>
    Réinitialiser les filtres
  </button>
}
