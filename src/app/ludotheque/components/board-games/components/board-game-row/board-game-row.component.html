<div [id]="boardGame.id" *ngIf="boardGame" class="book-core">
  <ng-container [ngTemplateOutlet]="image" *ngIf="parity && boardGame.cover"></ng-container>
  <div class="book-infos">
    <div class="book-title">{{boardGame.name}}
      <app-badge class="badge" [id]="boardGame.name" [status]="boardGame.status"></app-badge>
    </div>
    <div class="book-info" *ngIf="boardGame.ref">Ref: {{boardGame.ref}}</div>
    <div class="book-info" *ngIf="boardGame.poids">Poids: {{boardGame.poids}}g</div>
    <div class="book-info" *ngIf="boardGame.minPlayers">Min players: {{boardGame.minPlayers}}</div>
    <div class="book-info" *ngIf="boardGame.maxPlayers">Max players: {{boardGame.maxPlayers}}</div>
    <div class="book-info" *ngIf="boardGame.minAge">Min age: {{boardGame.suggestedPlayAge}}</div>
    <div class="book-info" *ngIf="boardGame.suggestedPlayAge">Suggested age: {{boardGame.suggestedPlayAge}}</div>
    <div class="book-info" *ngIf="boardGame.yearPublished">Published: {{boardGame.yearPublished}}</div>
    <div class="book-info" *ngIf="boardGame.themes && boardGame.themes.length">
      Themes :
      <ng-container *ngFor="let theme of boardGame.themes">
        {{theme}}
      </ng-container>
    </div>
    <div class="book-resume" [innerHTML]="boardGame.description"></div>
  </div>
  <ng-container [ngTemplateOutlet]="image" *ngIf="!parity && boardGame.cover"></ng-container>
</div>

<ng-template #image>
  <div class="book-cover">
    <img width="400" height="400" [src]="boardGame!.cover" [alt]="boardGame.name"/>
  </div>
</ng-template>
