<div [id]="boardGame.id" *ngIf="boardGame" class="book-core">
  <ng-container [ngTemplateOutlet]="image" *ngIf="parity && boardGame.cover"></ng-container>
  <div class="book-infos">
    <div class="book-title">{{boardGame.name}}
      <app-game-status class="badge" [game]="boardGame"></app-game-status>
      <!--<button mat-raised-button (click)="borrowGame(boardGame)">Réserver</button>-->
    </div>
    <div class="book-info" *ngIf="boardGame.ref">Ref: {{boardGame.ref}}</div>
    <div class="book-info" *ngIf="boardGame.weight">Poids: {{boardGame.weight}}g</div>
    <div class="book-info" *ngIf="boardGame.minPlayers">Min joueurs: {{boardGame.minPlayers}}</div>
    <div class="book-info" *ngIf="boardGame.maxPlayers">Max joueurs: {{boardGame.maxPlayers}}</div>
    <div class="book-info" *ngIf="boardGame.minAge">Age mini: {{boardGame.minAge}}</div>
    <div class="book-info" *ngIf="boardGame.suggestedPlayAge">Age suggéré: {{boardGame.suggestedPlayAge}}</div>
    <div class="book-info" *ngIf="boardGame.yearPublished">Année de publication: {{boardGame.yearPublished}}</div>
    <div class="book-info" *ngIf="boardGame.themes && boardGame.themes.length">
      Themes :
      <ng-container *ngFor="let theme of boardGame.themes">
        {{theme}}
      </ng-container>
    </div>
    <app-futur-reservations [game]="boardGame"></app-futur-reservations>
    <div class="book-resume" [innerHTML]="boardGame.description"></div>
  </div>
  <ng-container [ngTemplateOutlet]="image" *ngIf="!parity && boardGame.cover"></ng-container>
</div>

<ng-template #image>
  <div class="book-cover">
    <img width="400" height="400" [src]="boardGame!.cover" [alt]="boardGame.name"/>
  </div>
</ng-template>
