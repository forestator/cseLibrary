<div *ngIf="books" class="new-page fadein">
    <div id="new">
        <div class="title">
            Nouveautés
            <mat-icon (click)="exportNewsAsPDF()">picture_as_pdf</mat-icon>
        </div>
        <app-book-row
            [id]="book.book.id"
            *ngFor="let book of books;let index=index;"
            [book]="book.book"
            [library]="library"
            [category]="book.category"
            [index]="index">
        </app-book-row>
    </div>
    <div id="inProject">
        <div class="title">En projet</div>
        <app-book-row
            [id]="book.book.id"
            *ngFor="let book of booksInProject;let index=index;"
            [book]="book.book"
            [library]="library"
            [category]="book.category"
            [index]="index">
        </app-book-row>
    </div>
</div>
