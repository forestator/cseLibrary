<h2 mat-dialog-title class="dialog-title">
  <span class="dialog-title-icon delete-icon"><mat-icon aria-hidden="true">delete</mat-icon></span>
  Confirmation de suppression
</h2>
<mat-dialog-content class="dialog-content">
  <p class="message">{{data.message}}</p>
</mat-dialog-content>
<mat-dialog-actions class="dialog-actions">
  <button type="button" mat-stroked-button (click)="close(false)">Abandonner</button>
  <button type="button" mat-flat-button class="confirm-button" (click)="close(true)" cdkFocusInitial>
    <mat-icon aria-hidden="true">delete</mat-icon>
    Confirmer
  </button>
</mat-dialog-actions>
