<h1 *ngIf="!isNew" mat-dialog-title>
    <mat-icon>edit</mat-icon>
    Edition de la categorie : {{name.value}}
</h1>
<h1 *ngIf="isNew" mat-dialog-title>
    <mat-icon>add</mat-icon>
    Ajout d'une nouvelle categorie
</h1>
<div mat-dialog-content>
    <form>
        <mat-form-field class="full-width" appearance="fill">
            <mat-label for="name">Nom</mat-label>
            <input id="name" matInput placeholder="Nom" [formControl]="name">
        </mat-form-field>

        <mat-form-field class="full-width resume" appearance="fill">
            <mat-label for="resume">Résumé</mat-label>
            <textarea id="resume" matInput placeholder="Résumé" [formControl]="resume"></textarea>
        </mat-form-field>

        <mat-form-field class="full-width visuel" appearance="fill">
            <mat-label for="visuel">Visuel</mat-label>
            <textarea id="visuel" matInput placeholder="Visuel" [formControl]="visuel"></textarea>
        </mat-form-field>

        <mat-form-field class="full-width prefix" appearance="fill">
            <mat-label for="prefix">Prefix</mat-label>
            <textarea id="prefix" matInput placeholder="Prefix" [formControl]="prefix"></textarea>
        </mat-form-field>

    </form>
</div>
<div mat-dialog-actions>
    <button mat-raised-button (click)="cancel()">
        <mat-icon>cancel</mat-icon>
        Abandonner
    </button>
    <button mat-raised-button color="primary" (click)="save()" cdkFocusInitial>
        <mat-icon>check</mat-icon>
        Enregistrer
    </button>
</div>
