<h1 *ngIf="!isNew" mat-dialog-title>
    <mat-icon>edit</mat-icon>
    Edition de la serie : {{title.value}}
</h1>
<h1 *ngIf="isNew" mat-dialog-title>
    <mat-icon>add</mat-icon>
    Ajout d'une nouvelle serie
</h1>
<div mat-dialog-content>
    <form>
        <mat-form-field class="full-width" appearance="fill">
            <mat-label for="title">Titre</mat-label>
            <input id="title" matInput placeholder="Titre" [formControl]="title">
        </mat-form-field>

        <mat-form-field class="full-width resume" appearance="fill">
            <mat-label for="resume">Résumé</mat-label>
            <textarea id="resume" matInput placeholder="Résumé" [formControl]="resume"></textarea>
        </mat-form-field>

        <mat-form-field class="full-width" appearance="fill">
            <mat-label for="author">Auteur</mat-label>
            <mat-select id="author" [formControl]="author">
                <mat-option *ngFor="let option of data.biblio?.authors" [value]="option">
                    {{option.firstName}} {{option.lastName}}
                </mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field class="full-width" appearance="fill">
            <mat-label for="status">Status</mat-label>
            <mat-select id="status" [formControl]="status">
                <mat-option *ngFor="let option of allStatus" [value]="option">
                    {{option}}
                </mat-option>
            </mat-select>
        </mat-form-field>
    </form>
</div>
<div mat-dialog-actions>
    <button mat-raised-button (click)="cancel()">
        <mat-icon>cancel</mat-icon>
        Abandonner
    </button>
    <button mat-raised-button color="primary" (click)="save()" cdkFocusInitial>
        <mat-icon>check</mat-icon>
        Enregistrer
    </button>
</div>
