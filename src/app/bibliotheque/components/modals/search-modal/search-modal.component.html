<h2 mat-dialog-title class="dialog-title">
  <span class="dialog-title-icon"><mat-icon aria-hidden="true">search</mat-icon></span>
  Recherche par {{data.by}}, {{results.length}} résultat(s)
</h2>
<mat-dialog-content class="dialog-content">
  <ul class="results" #top>
    @for (result of results; track $index; let index = $index) {
      <li class="result" [class.result-selected]="selectedIndex() === index">
        <mat-checkbox [checked]="selectedIndex() === index" (change)="toggle(index, $event.checked)">
          Sélectionner le résultat {{index + 1}}
        </mat-checkbox>
        <dl class="result-rows">
          @for (row of result.rows; track row.label) {
            <div class="result-row">
              <dt>{{row.label}}</dt>
              <dd>{{row.value}}</dd>
            </div>
          }
        </dl>
      </li>
    }
  </ul>
</mat-dialog-content>
<mat-dialog-actions class="dialog-actions">
  <button type="button" mat-icon-button aria-label="Revenir en haut" (click)="top.scrollIntoView()">
    <mat-icon aria-hidden="true">keyboard_arrow_up</mat-icon>
  </button>
  <button type="button" mat-button (click)="cancel()">Abandonner</button>
  <button type="button" mat-flat-button (click)="save()" cdkFocusInitial>
    <mat-icon aria-hidden="true">check</mat-icon>
    Enregistrer
  </button>
</mat-dialog-actions>
