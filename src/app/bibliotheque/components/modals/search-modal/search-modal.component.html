<h2 mat-dialog-title #top>
  <mat-icon>search</mat-icon>
  Recherche par {{data.by}}, {{results.length}} résultat(s)
</h2>
@for (result of results; track $index; let index = $index) {
  <mat-dialog-content class="search">
    <div class="search-item">
      <mat-checkbox [checked]="selectedIndex() === index" (change)="toggle(index, $event.checked)">Selection</mat-checkbox>
    </div>
    @for (row of result.rows; track row.label) {
      <div class="search-item">
        <div class="search-label">{{row.label}}</div>
        <div class="search-value">{{row.value}}</div>
      </div>
    }
  </mat-dialog-content>
}
<mat-dialog-actions>
  <button type="button" mat-icon-button aria-label="Revenir en haut" (click)="top.scrollIntoView()">
    <mat-icon>keyboard_arrow_up</mat-icon>
  </button>
  <button type="button" mat-raised-button (click)="cancel()">
    <mat-icon>cancel</mat-icon>
    Abandonner
  </button>
  <button type="button" mat-raised-button color="primary" (click)="save()" cdkFocusInitial>
    <mat-icon>check</mat-icon>
    Enregistrer
  </button>
</mat-dialog-actions>
