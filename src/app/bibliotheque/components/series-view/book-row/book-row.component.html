<article [id]="book().id" class="book-core" [class.book-core-reverse]="isReversed()">
  <div class="book-cover">
    <img [alt]="'Couverture de ' + book().name" [src]="biblio().library?.path | bookCover: book().cover">
    @if (badge()) {
      <div class="badge">{{badge()}}</div>
    }
  </div>
  <div class="book-infos">
    <div class="book-title">{{book().name}}
      <app-badge [status]="book().status" />
    </div>
    <div class="book-authors">{{authors()}}</div>
    @for (info of infos(); track info.label) {
      <div class="book-info">{{info.label}}: {{info.value}}</div>
    }
    <div class="book-resume">
      {{book().resume}}
    </div>
  </div>
</article>
