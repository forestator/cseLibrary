<div *ngIf="library && category && author" class="core-page fadein">
    <div class="core-header">
        <div class="core-title">
            <div class="secondary" (click)="selectLibrary(library?.id)">{{library.name}}</div>
            <mat-icon>navigate_next</mat-icon>
            <div class="secondary" (click)="selectCategory(category?.id)">{{category.name}}</div>
            <mat-icon>navigate_next</mat-icon>
            <div class="primary">{{author.lastName}} {{author.firstName}}</div>
            <div class="counter">{{counter}} livre(s)</div>
        </div>
        <div class="core-resume">
            {{author.resume}}
        </div>
        <div class="books">
            <div *ngFor="let book of books" [class]="book.id?'book':'separator'" [title]="book.name">
                <a *ngIf="book.id" [href]="'#'+book.id">
                    <img class="book-cover" [src]="library?.path+'/'+book.cover">
                </a>
                <div *ngIf="book.id" class="book-badge">
                    <app-badge [status]="book.status" [display]="'small'"></app-badge>
                </div>
            </div>
        </div>
    </div>

    <div class="core-body">
        <ng-container *ngFor="let book of books; let index=index;">
            <app-book-row *ngIf="book.id" [book]="book" [index]="index"></app-book-row>
            <div class="series-separator" *ngIf="book.status==='SEPARATOR'">
                <div>{{book.name}}</div>
                <div>{{book.resume}}</div>
            </div>
        </ng-container>
    </div>
</div>
