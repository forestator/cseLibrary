<mat-accordion>
  <mat-expansion-panel>
    <mat-expansion-panel-header>
      <mat-panel-title>
        <span class="author-title">{{author().lastName}} {{author().firstName}}</span>
        <span class="author-info">{{counter()}} livres</span>
      </mat-panel-title>
    </mat-expansion-panel-header>
    @if (books().length) {
      <app-book-table [books]="books()" [biblio]="biblio()" />
    }
    @for (entry of series(); track entry.series.id) {
      <app-book-table [books]="entry.books" [biblio]="biblio()" [seriesName]="entry.series.name" />
    }
  </mat-expansion-panel>
</mat-accordion>
