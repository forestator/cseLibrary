<mat-accordion>
  <mat-expansion-panel>
    <mat-expansion-panel-header>
      <mat-panel-title>
        <app-series-badge [series]="series()" />
        <span class="series-title">{{series().name}}</span>
        <span class="series-info">{{visibleBooks().length}} livres</span>
      </mat-panel-title>
    </mat-expansion-panel-header>
    {{series().resume}}
    @if (series().books) {
      <app-book-table [books]="visibleBooks()" [biblio]="biblio()" [showAuthors]="true" />
    }
  </mat-expansion-panel>
</mat-accordion>
