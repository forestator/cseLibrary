<div *ngIf="(library$ | async) && category" class="core-page fadein">
    <div class="core-header">
        <div class="core-title">
            <div class="secondary"></div>
            <mat-icon>navigate_next</mat-icon>
            <div class="primary">{{category?.name}}</div>
            <div class="counter">{{counter}} livres</div>
        </div>
        <div class="core-resume">
            {{category?.resume}}
        </div>
        <div *ngIf="category?.by===VIEW_BY.BY_AUTHOR">
            <app-alphabet *ngIf="category?.by===VIEW_BY.BY_AUTHOR"></app-alphabet>
        </div>
        <div *ngIf="category?.by===VIEW_BY.BY_SERIES" class="all-series">
            <div *ngFor="let series of category?.series | seriesFilter : tools.adminMode" class="series bloc-link" (click)="selectSeries(series?.id)">
                <div class="series-title">{{series.name}}</div>
                <div class="series-info">{{(series.books | bookFilter: tools.adminMode).length}} livres</div>
            </div>
        </div>
    </div>
    <div *ngIf="category?.by===VIEW_BY.BY_SERIES" class="category-core">
      <ng-template #book>
        <app-series-row
            *ngFor="let series of category?.series  | seriesFilter : tools.adminMode"
            [series]="series">
        </app-series-row>
      </ng-template>
    </div>
    <div *ngIf="category?.by===VIEW_BY.BY_AUTHOR" class="category-core">
        <app-author-row
            *ngFor="let author of category?.authors"
            [author]="author"
            (sendView)="selectAuthor($event)">
        </app-author-row>
    </div>
</div>
