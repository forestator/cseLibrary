@if (library(); as library) {
  <div class="core-page fadein">
    <div class="core-header">
      <div class="core-title">
        <div class="primary">{{library.name}}</div>
      </div>
      <div class="core-resume">
        {{library.resume}}
      </div>
    </div>
    @for (category of library.categories; track category.id) {
      @let background = library.path | categoryBackground: category.bg;
      <a
        class="core-body core-body-category"
        [routerLink]="category.id"
        title="Clickez ici pour visualiser cette categorie">
        @if (!isMobile()) {
          <div>
            <img alt="" class="category-visuel" [src]="background">
          </div>
        }
        <div class="core-header">
          @if (isMobile()) {
            <img alt="" class="category-visuel small-display" [src]="background">
          }
          <div class="core-title">
            <div class="primary">{{category.name}}</div>
          </div>
          <div class="core-resume">
            {{category.resume}}
          </div>
        </div>
      </a>
    }
  </div>
}
