@if (library(); as library) {
  <div class="page">
    <app-page-header [title]="library.name" [resume]="library.resume" [crumbs]="crumbs" [facts]="facts()" />
    @if (cards().length) {
      <ul class="cards">
        @for (card of cards(); track card.id; let first = $first) {
          <li>
            <a class="card" [routerLink]="card.id">
              <img class="card-image" [ngSrc]="card.path | categoryBackground: card.background" fill alt="" [priority]="first" sizes="(max-width: 840px) 100vw, 33vw">
              <span class="card-content">
                <h2 class="card-title">{{card.name}}</h2>
                <span class="card-text">{{card.resume}}</span>
                <span class="card-note">
                  <span>{{card.count}} livres</span>
                  <span>{{card.unit}}</span>
                  <mat-icon class="card-go" aria-hidden="true">arrow_forward</mat-icon>
                </span>
              </span>
            </a>
          </li>
        }
      </ul>
    } @else {
      <app-empty-state title="Aucune catégorie" text="Cette bibliothèque ne contient pas encore de catégorie." />
    }
  </div>
} @else {
  <div class="page">
    <app-skeleton variant="cards" [count]="6" />
  </div>
}
