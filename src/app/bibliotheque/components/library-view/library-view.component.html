@if ((library$ | async); as library) {
  <div class="core-page fadein">
    <div class="core-header">
      <div class="core-title">
        <div class="primary">{{library.name}}</div>
      </div>
      <div class="core-resume">
        {{library.resume}}
      </div>
    </div>
    @for (category of library?.categories; track category) {
      <div
        class="core-body core-body-category"
        [routerLink]="category.id"
        title="Clickez ici pour visualiser cette categorie">
        @if (!(toolsService.mobilePhoneDisplay$ | async)) {
          <div>
            <img alt="" class="category-visuel"
              [src]="($safeNavigationMigration(library?.path) | categoryBackground: category.bg) | async">
          </div>
        }
        <div class="core-header">
          @if (toolsService.mobilePhoneDisplay$ | async) {
            <img alt="" class="category-visuel small-display"
              [src]="($safeNavigationMigration(library?.path) | categoryBackground: category.bg) | async">
          }
          <div class="core-title">
            <div class="primary">{{category.name}}</div>
          </div>
          <div class="core-resume">
            {{category.resume}}
          </div>
        </div>
      </div>
    }
  </div>
}
