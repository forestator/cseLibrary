@if (biblio() && authors()) {
  <div class="core-page fadein">
    <div class="core-header">
      <div class="core-title">
        <div class="secondary" (click)="selectLibrary(biblio().library.id)">{{biblio().library.name}}</div>
        <mat-icon>navigate_next</mat-icon>
        <div class="primary">Par Auteur</div>
        <!-- <div class="counter">{{counter}} auteur</div> -->
      </div>
      <app-alphabet></app-alphabet>
    </div>
    <div class="core-body">
      @for (author of authors(); track author) {
        <app-author-row
          [author]="author"
          [biblio]="biblio()"
          (sendView)="select($event)">
        </app-author-row>
      }
    </div>
  </div>
}
