@if (editor.libraryNode(); as libraryNode) {
  <div class="settings-page">
    <app-settings-panel [node]="libraryNode">
      <nav class="all-categories" aria-label="Sections de la bibliothèque">
        @for (tile of editor.tiles(); track tile.key) {
          <button
            type="button"
            class="category bloc-link"
            [class.bloc-selected]="tile.key === editor.selectedKey()"
            (click)="editor.selection.set(tile.selection)">
            <span class="category-title">{{tile.title}}</span>
            <span class="category-info">{{tile.info}}</span>
          </button>
        }
      </nav>
      <div class="selected-nodes" [class.selected-list]="editor.selection()?.kind !== 'category'">
        @for (node of editor.selectedNodes(); track node.id) {
          <app-settings-panel [node]="node" />
        }
      </div>
    </app-settings-panel>
  </div>
}
