@if (editor.libraryNode(); as libraryNode) {
  <div class="page">
    <app-page-header [title]="title()" [crumbs]="crumbs" resume="Modifiez les sections ci-dessous, puis enregistrez : les pages publiques sont mises à jour à l'enregistrement.">
      <button matButton="filled" type="button" [disabled]="!hasChanges() || saving()" (click)="save()">
        <mat-icon aria-hidden="true">save</mat-icon>
        {{saving() ? 'Enregistrement…' : 'Enregistrer les modifications'}}
      </button>
      <button matButton="outlined" type="button" [disabled]="!hasChanges() || saving()" (click)="discard()">Annuler les modifications</button>
    </app-page-header>
    <app-settings-panel [node]="libraryNode">
      <nav class="tiles" aria-label="Sections de la bibliothèque">
        @for (tile of editor.tiles(); track tile.key) {
          <button
            type="button"
            class="tile"
            [attr.aria-pressed]="tile.key === editor.selectedKey()"
            (click)="editor.selection.set(tile.selection)">
            <span class="tile-title">{{tile.title}}</span>
            <span class="tile-info">{{tile.info}}</span>
          </button>
        }
      </nav>
      <div class="selected">
        @for (node of editor.selectedNodes(); track node.id) {
          <app-settings-panel [node]="node" />
        } @empty {
          <app-empty-state icon="touch_app" title="Choisissez une section" text="Sélectionnez une catégorie, les auteurs ou les éditeurs pour les modifier." />
        }
      </div>
    </app-settings-panel>
  </div>
} @else {
  <div class="page">
    <app-skeleton variant="list" [count]="4" />
  </div>
}
