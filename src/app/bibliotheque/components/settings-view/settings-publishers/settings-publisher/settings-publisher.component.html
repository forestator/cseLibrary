<mat-expansion-panel>
    <mat-expansion-panel-header>
        <mat-panel-title>
            <div class="settings-header">
                <div class="designation">
                    #{{index()}}: {{publisher().name}}
                </div>
                <div class="controls">
                    <mat-icon class="ctrl-edit" (click)="edit($event)">edit</mat-icon>
                    <mat-icon class="ctrl-delete" (click)="delete($event)">delete</mat-icon>
                </div>
            </div>
        </mat-panel-title>
    </mat-expansion-panel-header>
    <div class="description">
        <div class="field">
            <div class="label">Nom</div>
            <div class="content">{{publisher().name}}</div>
        </div>
    </div>
</mat-expansion-panel>
