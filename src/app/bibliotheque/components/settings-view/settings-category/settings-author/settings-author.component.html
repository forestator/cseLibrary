<mat-expansion-panel>
    <mat-expansion-panel-header>
        <mat-panel-title>
            <div class="settings-header">
                <div class="designation">
                    #{{index}}: {{author.lastName}} {{author.firstName}}
                </div>
                <div class="controls">
                    <mat-icon class="ctrl-edit" (click)="edit($event)">edit</mat-icon>
                    <mat-icon class="ctrl-delete" (click)="delete($event)">delete</mat-icon>
                    <mat-icon *ngIf="author.by==='BY_AUTHOR'" class="ctrl-add" (click)="addBook($event)" title="Ajouter un nouveau livre">add</mat-icon>
                    <mat-icon *ngIf="author.by==='BY_AUTHOR'" class="ctrl-add" (click)="addSeries($event)" title="Ajouter une nouvelle serie">add-box</mat-icon>
                </div>
            </div>

        </mat-panel-title>
    </mat-expansion-panel-header>
    <div class="description">
        <div class="field">
            <div class="label">Nom</div>
            <div class="content">{{author.lastName}} {{author.firstName}}</div>
        </div>
        <div *ngIf="author.resume?.length" class="field">
            <div class="label">Résumé</div>
            <div class="content">{{author.resume}}</div>
        </div>
    </div>
    <app-settings-book
        *ngFor="let book of author.books; let bi=index;"
        [biblio]="biblio"
        [book]="book"
        [index]="index + '_' + (bi+1)">
    </app-settings-book>
    <app-settings-series
        *ngFor="let series of author.series; let si=index;"
        [biblio]="biblio"
        [series]="series"
        [index]="index + '_' + (si+1)">
    </app-settings-series>
</mat-expansion-panel>
