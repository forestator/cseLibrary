<div class="page">
  <app-page-header
    title="Bibliothèque"
    resume="Romans, bandes dessinées et livres jeunesse : parcourez les quatre bibliothèques du CSE par catégorie, série ou auteur." />

  @if (cards(); as libraryCards) {
    <ul class="cards">
      @for (card of libraryCards; track card.id; let index = $index) {
        <li>
          <a class="card" [routerLink]="card.id">
            <span class="card-cover">
              <img [ngSrc]="card.path | categoryBackground: card.cover" fill alt="" [priority]="index < 2" sizes="(max-width: 840px) 100vw, 40vw">
            </span>
            <span class="card-body">
              <h2 class="card-title">{{card.name}}</h2>
              <span class="card-text">{{card.resume}}</span>
              <span class="card-note">
                <mat-icon aria-hidden="true">category</mat-icon>{{card.categoryCount}}
                <mat-icon aria-hidden="true">menu_book</mat-icon>{{card.bookCount}}
              </span>
            </span>
          </a>
        </li>
      }
    </ul>
  } @else {
    <app-skeleton variant="cards" [count]="4" />
  }
</div>
