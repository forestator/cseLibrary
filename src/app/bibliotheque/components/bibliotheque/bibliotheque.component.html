<div class="core-page fadein">
    <div class="core-header" *ngFor="let biblio of allBiblio"
    [routerLink]="biblio.library?.id">
        <div class="core-title">
            <div class="primary">{{biblio.library?.name}}</div>
        </div>
        <div class="core-resume">
            {{biblio.library?.resume}}
        </div>
    </div>
</div>
