<div class="category-menu">
  <ng-container *ngIf="navService.url$ | async as url">
    <ng-container *ngIf="menu$ | async as menu">
      <ng-container *ngFor="let item of menu">
        <ng-container *ngIf="url.includes(item.library.id)">
          <div *ngFor='let category of item.library?.categories'
               class="cat-nav"
               [routerLink]="prefixRoute + item.library?.id + '/' + category.id">
            {{category?.name}}
          </div>
        </ng-container>
      </ng-container>
    </ng-container>
  </ng-container>
</div>
