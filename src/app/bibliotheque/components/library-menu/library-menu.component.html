<div class="category-menu">
  @if (navService.url$ | async; as url) {
    @if (menu$ | async; as menu) {
      @for (item of menu; track item) {
        @if (url.includes(item.library.id)) {
          @for (category of item.library?.categories; track category) {
            <div
              class="cat-nav"
              [routerLink]="prefixRoute + item.library?.id + '/' + category.id">
              {{category?.name}}
            </div>
          }
        }
      }
    }
  }
</div>
