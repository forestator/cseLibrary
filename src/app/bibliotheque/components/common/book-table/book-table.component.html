<table mat-table [dataSource]="books()" class="mat-elevation-z8 books">
  <ng-container matColumnDef="cover">
    <th mat-header-cell *matHeaderCellDef class="cell-cover">Couverture</th>
    <td mat-cell *matCellDef="let book">
      <img class="cover" [alt]="'Couverture de ' + book.name" [src]="biblio().library?.path | bookCover: book.cover">
    </td>
  </ng-container>
  <ng-container matColumnDef="title">
    <th mat-header-cell *matHeaderCellDef>Titre</th>
    <td mat-cell *matCellDef="let book">{{book.name}}</td>
  </ng-container>
  <ng-container matColumnDef="authors">
    <th mat-header-cell *matHeaderCellDef class="cell-authors">Auteur(s)</th>
    <td mat-cell *matCellDef="let book">{{book.authorIds | authorNames: biblio()}}</td>
  </ng-container>
  <ng-container matColumnDef="series">
    <th mat-header-cell *matHeaderCellDef>Serie</th>
    <td mat-cell *matCellDef="let book">{{seriesName()}}</td>
  </ng-container>
  <ng-container matColumnDef="tome">
    <th mat-header-cell *matHeaderCellDef>Tome</th>
    <td mat-cell *matCellDef="let book">{{book.tome}}</td>
  </ng-container>
  <ng-container matColumnDef="isbn">
    <th mat-header-cell *matHeaderCellDef class="cell-isbn">ISBN</th>
    <td mat-cell *matCellDef="let book">{{book.isbn10}}<br/>{{book.isbn13}}</td>
  </ng-container>
  <ng-container matColumnDef="page">
    <th mat-header-cell *matHeaderCellDef class="cell-format">Format</th>
    <td mat-cell *matCellDef="let book">{{book.page}}</td>
  </ng-container>
  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef class="cell-status">Status</th>
    <td mat-cell *matCellDef="let book">
      <app-badge [status]="book.status" />
    </td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="columns()"></tr>
  <tr mat-row *matRowDef="let row; columns: columns();"></tr>
</table>
